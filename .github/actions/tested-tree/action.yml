name: Tested tree
description: >
  Look up or record that a workflow already passed on this exact source tree.
  The pull request run, the merge queue run and the master push run usually
  test the same tree; only the first needs to do the work.

inputs:
  mode:
    description: "check: set output hit. record: store a pass for this key."
    required: true
  name:
    description: Workflow identifier, part of the key.
    required: true
  extra:
    description: Other inputs the result depends on (e.g. a pinned suite SHA).
    default: ""

outputs:
  hit:
    description: "'true' when a run from this repository already passed on this key."
    value: ${{ steps.key.outputs.hit }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        EXTRA: ${{ inputs.extra }}
        TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REPO_ID: ${{ github.repository_id }}
        API: ${{ github.api_url }}
      run: |
        set -euo pipefail
        key="tested-$NAME-$(git rev-parse 'HEAD^{tree}')${EXTRA:+-$EXTRA}"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "key: $key"
        if [ "$MODE" != check ]; then exit 0; fi
        # Only artifacts uploaded by runs of this repository's own branches
        # count: a fork pull request runs its own workflow file and could
        # upload a record under any name.
        hit=$(python3 - "$API/repos/$REPO/actions/artifacts?per_page=100&name=$key" "$REPO_ID" <<'PY'
        import json, os, sys, urllib.request
        req = urllib.request.Request(sys.argv[1], headers={
            "Authorization": "Bearer " + os.environ["TOKEN"],
            "Accept": "application/vnd.github+json"})
        arts = json.load(urllib.request.urlopen(req))["artifacts"]
        own = int(sys.argv[2])
        print("true" if any(not a["expired"] and a["workflow_run"]["head_repository_id"] == own
                            for a in arts) else "false")
        PY
        )
        echo "hit=$hit" >> "$GITHUB_OUTPUT"
        echo "already passed on this tree: $hit"

    - if: inputs.mode == 'record'
      shell: bash
      run: echo "${{ github.run_id }}" > "$RUNNER_TEMP/tested-tree"

    - if: inputs.mode == 'record'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.key.outputs.key }}
        path: ${{ runner.temp }}/tested-tree
        retention-days: 7
