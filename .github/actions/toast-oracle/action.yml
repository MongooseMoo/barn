name: Toast oracle
description: >-
  Builds the ToastStunt build a manifest in profiles/toast pins (by default
  stock-wsl-testdb.json, the conformance oracle), at toaststunt/build/moo:
  the same ref, a Release build, and options.h checked against the
  manifest's config checksum. The runner user cannot read
  the workstation's /root Toast build, so a job builds its own. Expects this
  repository checked out in the workspace.

inputs:
  manifest:
    description: The pinning manifest, relative to the repository root.
    default: profiles/toast/stock-wsl-testdb.json

runs:
  using: composite
  steps:
    - name: Read Toast oracle pin
      id: toast-pin
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        python3 -c 'import json, os; m = json.load(open(os.environ["MANIFEST"])); print("ref=" + m["implementation_ref"]); print("options=" + m["config_checksum"])' >> "$GITHUB_OUTPUT"

    - name: Checkout ToastStunt
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: MongooseMoo/toaststunt
        ref: ${{ steps.toast-pin.outputs.ref }}
        path: toaststunt
        persist-credentials: false

    - name: Build Toast oracle
      shell: bash
      env:
        OPTIONS_SHA256: ${{ steps.toast-pin.outputs.options }}
      run: |
        echo "$OPTIONS_SHA256  toaststunt/src/include/options.h" | sha256sum -c -
        # CMakeLists.txt generates version_options.h in cmake's working
        # directory, which must be the build directory to be included.
        mkdir toaststunt/build
        (cd toaststunt/build && cmake -DCMAKE_BUILD_TYPE=Release .. && cmake --build . -j2)
