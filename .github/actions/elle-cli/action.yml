name: Pinned Elle checker
description: >
  Install the checker's build dependencies when missing and build the pinned
  elle-cli uberjar. Sets ELLE_JAR for later steps. Requires setup-java first.

runs:
  using: composite
  steps:
    - name: Install checker dependencies
      shell: bash
      run: |
        set -euo pipefail
        if command -v lein >/dev/null && command -v dot >/dev/null; then
          exit 0
        fi
        # Composite steps cannot set timeout-minutes; bound both together.
        timeout 180 sh -c 'sudo -n apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update &&
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y leiningen graphviz'
    - name: Build pinned checker
      shell: bash
      env:
        ELLE_COMMIT: 3c2504815945cd4ab1b5cc0142d2fe206e1ee285
      run: |
        set -euo pipefail
        checker="$RUNNER_TEMP/elle-cli-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        git clone https://github.com/ligurio/elle-cli.git "$checker"
        git -C "$checker" checkout --detach "$ELLE_COMMIT"
        test "$(git -C "$checker" rev-parse HEAD)" = "$ELLE_COMMIT"
        export JAVA_CMD="$JAVA_HOME/bin/java"
        cd "$checker"
        lein uberjar
        echo "ELLE_JAR=$checker/target/elle-cli-0.1.11-standalone.jar" >> "$GITHUB_ENV"
