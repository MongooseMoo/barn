# Drop-in for each actions.runner.MongooseMoo.mongoose-barn-fuzz-N.service.
# svc.sh's generated unit has no Restart=, so on 2026-11-10 one lane's global
# OOM kill (OOMPolicy= defaults to stop) took listener 2 offline for good.
[Service]
# The listeners share barn-fuzz.slice's memory bound. Each one also has its
# own bound, so one lane's runaway worker is killed in its own cgroup: on
# 2026-11-12 one FuzzCheckpointResumeEquivalence worker grew to 25 GB, the
# slice reclaimed from every lane, and the other lanes' workers stalled until
# Go reported them hung. 12G is about 3.5x FuzzReadDatabase's normal ~3.4 GB.
Slice=barn-fuzz.slice
MemoryMax=12G
MemorySwapMax=0
# Losing the lane's test process must not stop the listener.
OOMPolicy=continue
# Any listener exit, including runsvc.sh's "no retry needed", comes back.
Restart=always
RestartSec=30
