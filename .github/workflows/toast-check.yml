name: Toast check

# Runs `barn toast-check` on the dump of the live world that goodput-series.yml
# measures, against the builtins the Toast build the live game runs registers
# (profiles/toast/mongoose-0ff6fd7-wsl-testdb.json; docs/mongoose-conformance.md
# names that commit). The run fails when any verb calls a builtin Barn
# registers and that Toast does not, or does not parse: Toast loads the first
# with a warning and raises E_INVARG when it runs, and refuses to load a
# database holding the second.
#
# The dump holds real players' data and this repository's logs are public.
# scripts/toast-check.sh keeps the check's output in the runner's temporary
# directory and prints only counts.
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/toast-check.yml
      - .github/workflows/goodput-series.yml
      - scripts/toast-check.sh
      - internal/dbtool/toast_check.go
      - profiles/toast/mongoose-0ff6fd7-wsl-testdb.json

permissions:
  contents: read

jobs:
  check:
    name: Every verb in the Mongoose dump runs on Mongoose Toast
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Read Toast pin
        id: toast-pin
        run: |
          python3 -c 'import json; m = json.load(open("profiles/toast/mongoose-0ff6fd7-wsl-testdb.json")); print("ref=" + m["implementation_ref"]); print("options=" + m["config_checksum"])' >> "$GITHUB_OUTPUT"

      - name: Checkout ToastStunt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MongooseMoo/toaststunt
          ref: ${{ steps.toast-pin.outputs.ref }}
          path: toaststunt
          persist-credentials: false

      # As ci.yml builds its oracle: an unmodified tree checked against the
      # manifest's options.h checksum, Release. CMakeLists.txt generates
      # version_options.h in cmake's working directory, which must be the build
      # directory to be included.
      - name: Build Toast
        env:
          OPTIONS_SHA256: ${{ steps.toast-pin.outputs.options }}
        run: |
          echo "$OPTIONS_SHA256  toaststunt/src/include/options.h" | sha256sum -c -
          mkdir toaststunt/build
          (cd toaststunt/build && cmake -DCMAKE_BUILD_TYPE=Release .. && cmake --build . -j2)

      - name: Build barn
        run: go build -o bin/barn ./cmd/barn/

      # The pin is goodput-series.yml's, read from it so the two cannot drift.
      - name: Copy the database and check it is the pinned one
        run: |
          set -euo pipefail
          pin() { awk -v key="$1:" '$1 == key { print $2 }' .github/workflows/goodput-series.yml; }
          mkdir -p "$RUNNER_TEMP/toast-check"
          cp "$(pin FIXTURE)" "$RUNNER_TEMP/toast-check/mongoose.db"
          echo "$(pin FIXTURE_SHA256)  $RUNNER_TEMP/toast-check/mongoose.db" | sha256sum --check --quiet

      - name: Run the check
        run: >-
          bash scripts/toast-check.sh toaststunt/build/moo bin/barn
          "$RUNNER_TEMP/toast-check/mongoose.db" "$RUNNER_TEMP/toast-check"

      - name: Remove the database copy and the check output
        if: always()
        run: rm -rf "$RUNNER_TEMP/toast-check"
