name: Elle isolation

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      seeds:
        description: Space-separated integer seeds
        type: string
        default: '412 395 396'
      rounds:
        description: Random rounds per healthy seed (8-10000)
        type: string
        default: '40'

permissions:
  contents: read
  actions: read

concurrency:
  group: elle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the required job when a run of this repository already passed on
  # this exact tree (see .github/actions/tested-tree). A manual dispatch
  # always runs.
  tested:
    name: Check for an earlier pass
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      hit: ${{ steps.tree.outputs.hit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: tree
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/tested-tree
        with:
          mode: check
          name: elle

  record:
    name: Record pass
    needs: isolation
    # Manual campaigns may select less work than the required PR configuration.
    # They must not populate its tested-tree pass record.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/tested-tree
        with:
          mode: record
          name: elle

  isolation:
    name: Serializable histories and negative control
    needs: tested
    if: needs.tested.outputs.hit != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check runner device
        run: test -c /dev/null
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build pinned checker
        uses: ./.github/actions/elle-cli
      - name: Check histories
        env:
          ELLE_SEEDS: ${{ inputs.seeds || '412 395 396' }}
          ELLE_ROUNDS: ${{ inputs.rounds || '40' }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_check_elle.py' -v
          go test -tags elle ./engine -run '^TestElleRecorder' -count=1
          read -r -a seeds <<< "$ELLE_SEEDS"
          python3 scripts/check_elle.py --jar "$ELLE_JAR" --java "$JAVA_HOME/bin/java" --output elle-evidence --seeds "${seeds[@]}" --rounds "$ELLE_ROUNDS"
      - name: Archive raw evidence
        if: always()
        run: |
          set -euo pipefail
          # Elle names some HTML witnesses after printed EDN keys, including
          # quotes. GitHub rejects those as individual artifact paths; retain
          # their original names and contents inside one portable archive.
          if [ -d elle-evidence ]; then
            tar -czf elle-evidence.tar.gz elle-evidence
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: elle-evidence-${{ github.sha }}
          path: elle-evidence.tar.gz
          if-no-files-found: warn
