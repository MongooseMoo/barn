name: Issue 279 memory evidence

# Temporary experiment; remove after collecting the results for this PR.
on:
  pull_request:
    paths:
      - .github/workflows/issue-279-evidence.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Measure original Mongoose checkpoint
        shell: bash
        env:
          BARN_MONGOOSE_DB: /mnt/c/Users/Q/projects/mongoose/db/mongoose.db.new.2026-10-10T0548
          BARN_MONGOOSE_SOUND_DB: /mnt/c/Users/Q/code/barn/.tmp/mongoose-account-20260917/sound.sqlite
          BARN_MONGOOSE_BENCH: '1'
          BARN_MONGOOSE_PLAYERS: '16'
          BARN_MONGOOSE_WARMUP: 5s
          BARN_MONGOOSE_MEASURE: 30s
          BARN_MONGOOSE_GOGC: '400'
          GOMAXPROCS: '32'
        run: |
          set -euo pipefail
          test -c /dev/null
          test -f "$BARN_MONGOOSE_DB"
          test -f "$BARN_MONGOOSE_SOUND_DB"
          evidence="/mnt/c/Users/Q/code/barn/.tmp/issue-279-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence"
          {
            git rev-parse HEAD
            go version
            uname -a
            getconf PAGESIZE
            sha256sum "$BARN_MONGOOSE_DB" "$BARN_MONGOOSE_SOUND_DB"
            env | sort | grep -E '^(BARN_MONGOOSE_|GOMAXPROCS=)'
          } > "$evidence/manifest.txt"
          go test -c -o "$evidence/engine.test" ./engine
          sha256sum "$evidence/engine.test" >> "$evidence/manifest.txt"
          cd engine
          failed=0
          for sample in 1 2 3 diagnostic; do
            if [ "$sample" = diagnostic ]; then
              export BARN_MONGOOSE_MEMSTATS=1 BARN_RUNTIME_DIAGNOSTICS=1 GODEBUG=gctrace=1
              export BARN_MONGOOSE_CPUPROFILE="$evidence/runtime.cpu"
              export BARN_MONGOOSE_MEMPROFILE="$evidence/runtime.heap"
              export BARN_MONGOOSE_LOG_DIR="$evidence/logs"
            fi
            if "$evidence/engine.test" -test.run '^TestMongooseRealWorkload$' -test.v -test.count=1 -test.timeout=180s > "$evidence/sample-$sample.txt" 2>&1; then
              echo "sample $sample: process exit 0"
            else
              code=$?
              echo "sample $sample: process exit $code"
              failed=1
            fi
            if grep -E 'cohort submitted=|players=16 goodput=|gc: cycles=|commands left without terminal' "$evidence/sample-$sample.txt"; then
              :
            else
              echo "sample $sample: no completed cohort summary"
              failed=1
            fi
          done
          echo "Raw evidence retained privately at $evidence"
          exit "$failed"
