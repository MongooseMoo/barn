name: Nightly fuzz

# Ordinary CI only replays committed fuzz inputs. This runs each target's
# coverage-guided campaign for a fixed time. A failure uploads the minimized
# input Go wrote under testdata/fuzz; commit it with its fix so CI replays it.
on:
  # Dispatched at 03:17 Mountain by the runner workstation's native task.
  # GitHub cron events were created many hours late, during the day.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The self-hosted runners share one workstation with PR CI.
      max-parallel: 2
      matrix:
        include:
          - { package: ./parser, target: FuzzParseFormatRoundTrip }
          - { package: ./parser, target: FuzzStructuredParseFormatRoundTrip }
          - { package: ./compiler, target: FuzzCompileVerifiable }
          - { package: ./compiler, target: FuzzStructuredCompileVerifiable }
          - { package: ./vm, target: FuzzSourceExecution }
          - { package: ./vm, target: FuzzStructuredSourceExecution }
          - { package: ./vm, target: FuzzRestoreVMSnapshotDoesNotPanic }
          - { package: ./bytecode, target: FuzzVerifyProgram }
          - { package: ./command, target: FuzzCommandLine }
          - { package: ./builtins, target: FuzzParseHTTPChunkedBody }
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Fuzz ${{ matrix.target }}
        id: campaign
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30m -parallel=2 -timeout=40m

      - name: Upload failing input
        id: artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PACKAGE: ${{ matrix.package }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const target = process.env.FUZZ_TARGET;
            const campaignFailed = process.env.CAMPAIGN_OUTCOME === 'failure';
            const title = campaignFailed
              ? `Nightly fuzz failure: ${target}`
              : `Nightly fuzz infrastructure failure: ${target}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const body = [
              `Target: ${process.env.FUZZ_PACKAGE}/${target}`,
              `Run: ${run}`,
              campaignFailed ? 'The fuzz command failed; inspect its log for the cause.' : 'The job failed outside the fuzz command; inspect the failed step.',
              process.env.ARTIFACT_URL ? `Failing inputs: ${process.env.ARTIFACT_URL} (retained for 30 days).` : 'No failing-input artifact was uploaded.',
              'Preserve confirmed failing inputs with their regression fixes.'
            ].join('\n\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body
              });
            } else {
              // GITHUB_TOKEN events start no other workflows, except
              // workflow_dispatch, so dispatch the fix run explicitly.
              const {data: issue} = await github.rest.issues.create({
                ...context.repo, title, body, labels: ['claude-fix']
              });
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'claude-fix.yml', ref: 'master',
                inputs: {issue_number: String(issue.number)}
              });
            }
