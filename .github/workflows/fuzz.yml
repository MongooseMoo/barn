name: Nightly fuzz
run-name: Nightly fuzz / ${{ inputs.compute-mode }}${{ inputs.campaign == 'native-only' && ' / native-only' || '' }}

# Every discovery job runs in the server's dedicated runner group.
# A continuous cycle submits its own successor in its last job;
# fuzz-controller.yml only resumes a stalled chain on its schedule.
on:
  workflow_dispatch:
    inputs:
      compute-mode:
        description: Compute pool and cycle lifetime
        type: choice
        default: dedicated-once
        options: [dedicated-once, dedicated-continuous]
      campaign:
        description: Native discovery alone or with Toast comparison
        type: choice
        default: native-and-toast
        options: [native-and-toast, native-only]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-fuzz-dedicated
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch'
    name: Validate compute routing
    runs-on:
      group: barn-bug-discovery
      labels: [self-hosted, Linux, X64, barn-fuzz]
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      parallel: ${{ steps.route.outputs.parallel }}
      campaign: ${{ steps.route.outputs.campaign }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: route
        env:
          COMPUTE_MODE: ${{ inputs.compute-mode }}
          FUZZ_CAMPAIGN: ${{ inputs.campaign }}
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
        with:
          script: require('./scripts/fuzz_compute.cjs').configure({context, core});

  fuzz:
    needs: route
    name: ${{ matrix.target }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      # An isolated public-only fuzz/build cache prevents importing a runner
      # owner's private local-world corpus. Retained corpus is restored below.
      GOCACHE: ${{ github.workspace }}/.fuzz/go-cache/${{ github.run_id }}-${{ matrix.target }}
      BARN_FUZZ_CORPUS: ''
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_PACKAGE: ${{ matrix.package }}
      FUZZ_MINUTES: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.route.outputs.parallel) }}
      # minutes is each lane's campaign time. Lanes that add a handful of new
      # inputs per 30 minutes and have never found a bug get 5.
      matrix:
        include:
          - { package: ./parser, target: FuzzParseFormatRoundTrip, minutes: 30 }
          - { package: ./parser, target: FuzzStructuredParseFormatRoundTrip, minutes: 5 }
          - { package: ./compiler, target: FuzzCompileVerifiable, minutes: 30 }
          - { package: ./compiler, target: FuzzStructuredCompileVerifiable, minutes: 30 }
          - { package: ./vm, target: FuzzSourceExecution, minutes: 30 }
          - { package: ./vm, target: FuzzStructuredSourceExecution, minutes: 30 }
          - { package: ./vm, target: FuzzRestoreVMSnapshotDoesNotPanic, minutes: 30 }
          - { package: ./bytecode, target: FuzzVerifyProgram, minutes: 5 }
          - { package: ./db/format, target: FuzzReadDatabase, minutes: 30 }
          - { package: ./command, target: FuzzCommandLine, minutes: 30 }
          - { package: ./builtins, target: FuzzParseHTTPChunkedBody, minutes: 5 }
          - { package: ./server, target: FuzzTCPReadInput, minutes: 5 }
          - { package: ./builtins, target: FuzzStringBuiltins, minutes: 30 }
          - { package: ./vm, target: FuzzCheckpointResumeEquivalence, minutes: 30 }
          - { package: ./vm, target: FuzzWorldCheckpointEffects, minutes: 30 }
          - { package: ./vm, target: FuzzSuspendedStackCheckpoint, minutes: 30 }
          - { package: ./task, target: FuzzSuspensionCompletionHistory, minutes: 5 }
          - { package: ./types, target: FuzzMapUpdatesPreserveSnapshotsAndInsertionOrder, minutes: 5 }
          - { package: ./db/store, target: FuzzStoreCommitsMatchSerialReplay, minutes: 30 }
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Restore retained public corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # matrix.package starts with ./ and actions/cache rejects a path with a
          # . segment; target names are unique, so ** finds the lane directory.
          path: |
            .fuzz/retained/**/${{ matrix.target }}/inputs
            .fuzz/retained/**/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-public-v1-${{ matrix.target }}-
      - name: Replay retained corpus into native cache
        run: |
          python3 scripts/fuzz_retention.py restore --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)"

      - name: Fuzz ${{ matrix.target }}
        id: campaign
        # Go stops a campaign at its first failing input, so start the target
        # again with the time left until the lane's minutes are used. Each finding
        # is reported, and its repair dispatched, before the next attempt.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          inputs="${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}"
          found="$RUNNER_TEMP/fuzz-found" logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$found" "$logs"
          mkdir -p "$found" "$logs" "$inputs"
          # Go replays testdata/fuzz as seeds and a failing seed stops the next
          # campaign at once, so saved inputs wait aside until the step ends.
          # Go names inputs by content hash: equal names hold equal bytes.
          trap 'find "$found" -type f -exec mv -t "$inputs" {} +' EXIT
          deadline=$((SECONDS + FUZZ_MINUTES * 60)) run=0 status=0
          # The cycle acceptance job reads `cycle`: a saved finding is a
          # completed campaign; a failure without a saved input is not.
          # Go discards a fuzz worker's stderr; internal/fuzzcrash writes each
          # test process's fatal error output here instead.
          export BARN_FUZZ_CRASH_DIR="$RUNNER_TEMP/fuzz-crash"
          # Test temp files go to tmpfs. The checkpoint properties write and
          # fsync a checkpoint at every suspend(); on the guest's shared disk
          # those syncs held one input past Go's 60 s per-input limit, whose
          # panic("deadlocked!") exits the worker 2 (#801). Builds stay on disk.
          export TMPDIR="/dev/shm/barn-fuzz-$GITHUB_RUN_ID-$FUZZ_TARGET" GOTMPDIR="$RUNNER_TEMP/go-tmp"
          mkdir -p "$TMPDIR" "$GOTMPDIR"
          while remaining=$((deadline - SECONDS)); [ "$remaining" -ge 60 ]; do
            run=$((run + 1))
            log="$logs/run-$(printf %03d "$run").log"
            rm -rf "$BARN_FUZZ_CRASH_DIR" && mkdir -p "$BARN_FUZZ_CRASH_DIR"
            if {
              go version
              # Keep the original failing seed so quarantine can remove its
              # exact bytes from the disposable cache before retrying.
              env -u GITHUB_TOKEN go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime="${remaining}s" -fuzzminimizetime=0 -parallel=4 -timeout="$((remaining + 600))s" && rc=0 || rc=$?
              # A dead worker's panic or fatal error goes into the log, where
              # fuzz_report.py reads its first error and Barn frames.
              find "$BARN_FUZZ_CRASH_DIR" -type f -size +0 -exec cat {} +
              exit "$rc"
            } 2>&1 | tee "$log"; then
              mv "$log" "$logs/success-$(printf %03d "$run").log"
              break
            fi
            status=1
            # Go on only after a saved finding, so a broken setup cannot spin.
            input=$(python3 scripts/fuzz_report.py --log "$log" --package '${{ matrix.package }}' \
                --target '${{ matrix.target }}' --commit "$GITHUB_SHA" --campaign-outcome failure |
              python3 -c 'import json, sys; r = json.load(sys.stdin)[0]; print(r["input_path"] if r["kind"] != "infrastructure" and r["input_path"] else "")')
            if [ -z "$input" ]; then echo "cycle=infrastructure" >> "$GITHUB_OUTPUT"; exit 1; fi
            # Report now, while the exact record is still in place; the issue
            # carries it, since its artifact is uploaded only when the job ends.
            reported=()
            for prior in "$logs"/reported-*.log; do [ -e "$prior" ] && reported+=(--reported-log "$prior"); done
            python3 scripts/fuzz_report.py --log "$log" "${reported[@]}" --package '${{ matrix.package }}' \
                --target '${{ matrix.target }}' --commit "$GITHUB_SHA" --campaign-outcome failure \
                --publish --immediate > /dev/null && published=0 || published=$?
            case "$published" in
              0) mv "$log" "$logs/reported-$(printf %03d "$run").log" ;;
              3) echo "::notice::$input is too large for an issue; it is reported with its artifact when the job ends." ;;
              *) echo "::error::Reporting $input failed; Open failure issues retries it when the job ends." ;;
            esac
            python3 scripts/fuzz_retention.py quarantine --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --input "$input" --found "$found"
          done
          echo "cycle=$([ "$status" = 0 ] && echo clean || echo finding)" >> "$GITHUB_OUTPUT"
          exit "$status"


      - name: Capture public interesting inputs and execution census
        if: always()
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outputs.cycle }}
        run: |
          python3 scripts/fuzz_retention.py capture --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)" --logs "$RUNNER_TEMP/fuzz-logs" --campaign "$CAMPAIGN_OUTCOME"

      # The source lanes also replay actual discoveries with normal cleanup in
      # one process per input. At most 60 s per 30-minute lane; mutation rate
      # and the existing campaign duration/limits stay unchanged.
      - name: Check source corpus resource lifetimes
        if: ${{ !cancelled() && (matrix.target == 'FuzzSourceExecution' || matrix.target == 'FuzzStructuredSourceExecution') }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/memory_check.py --cache "$GOCACHE" --target "$FUZZ_TARGET" \
            --output ".fuzz/memory/$FUZZ_TARGET" --seconds 60 || status=$?
          cp ".fuzz/memory/$FUZZ_TARGET/results.json" ".fuzz/retained/vm/$FUZZ_TARGET/memory.json"
          exit "$status"

      - name: Upload memory replay evidence
        id: memory-artifact
        if: ${{ always() && (matrix.target == 'FuzzSourceExecution' || matrix.target == 'FuzzStructuredSourceExecution') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-memory-${{ matrix.target }}
          path: .fuzz/memory/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Report memory replay findings
        if: ${{ !cancelled() && (matrix.target == 'FuzzSourceExecution' || matrix.target == 'FuzzStructuredSourceExecution') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.memory-artifact.outputs.artifact-url }}
        run: |
          python3 scripts/fuzz_report.py --memory-result ".fuzz/memory/$FUZZ_TARGET/results.json" \
            --package "$FUZZ_PACKAGE" --target "$FUZZ_TARGET" --commit "$GITHUB_SHA" \
            --campaign-outcome failure --artifact-url "$ARTIFACT_URL" --publish

      - name: Upload retained corpus and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: .fuzz/retained/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Save retained public corpus for the next host or cycle
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .fuzz/retained/**/${{ matrix.target }}/inputs
            .fuzz/retained/**/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failing input
        id: artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - &failure-reporter
        name: Open failure issues
        if: ${{ failure() && steps.campaign.outcome != 'success' }}
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          GITHUB_TOKEN: ${{ github.token }}
        # Reports what the campaign did not report while it ran: failures with
        # no saved finding, records too large for an issue, and retries.
        run: |
          if [ ! -f scripts/fuzz_report.py ]; then
            echo "::error::Checkout failed before the reporter was available; inspect the failed step."
            exit 1
          fi
          logs="$RUNNER_TEMP/fuzz-logs" args=()
          for log in "$logs"/run-*.log; do [ -e "$log" ] && args+=(--log "$log"); done
          for log in "$logs"/reported-*.log; do [ -e "$log" ] && args+=(--reported-log "$log"); done
          python3 scripts/fuzz_report.py "${args[@]}" --package "$FUZZ_PACKAGE" --target "$FUZZ_TARGET" \
            --commit "$GITHUB_SHA" --campaign-outcome "$CAMPAIGN_OUTCOME" --artifact-url "$ARTIFACT_URL" --publish

      - name: Remove this job's disposable build cache
        if: always()
        run: |
          expected="$GITHUB_WORKSPACE/.fuzz/go-cache/$GITHUB_RUN_ID-${{ matrix.target }}"
          [ "$GOCACHE" = "$expected" ] && [ "$GOCACHE" != / ] && rm -rf -- "$GOCACHE"
          # A killed worker leaves its temp files on tmpfs, holding memory.
          rm -rf -- "/dev/shm/barn-fuzz-$GITHUB_RUN_ID-${{ matrix.target }}"

  differential:
    needs: [route, fuzz]
    # Even a native finding must preserve and replay the producers' artifacts.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' && needs.route.outputs.campaign == 'native-and-toast' }}
    # A fixed scalar job also has this name when skipped before matrix expansion.
    name: ToastDifferential
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      TOAST_BIN: ${{ github.workspace }}/toaststunt/build/moo
      BARN_FUZZ_CORPUS: ''
      FUZZ_TARGET: ToastDifferential
      FUZZ_PACKAGE: ./scripts
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Download this cycle's native producer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fuzz-corpus-*
          merge-multiple: true
          path: .fuzz/retained

      - name: Build Toast oracle
        run: bash scripts/build-toast-oracle.sh

      - name: Build Barn
        run: |
          go list -f '{{.ImportPath}} {{.Name}}' ./cmd/barn
          go build -o bin/ ./cmd/barn

      # The builtin census counts the conformance tests that call each builtin
      # with the suite's own scanner, so it needs the suite and uv.
      - name: Checkout moo-conformance-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: MongooseMoo/moo-conformance-tests
          path: moo-conformance-tests

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Compare retained public source on Barn and Toast
        id: campaign
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$logs"
          mkdir -p "$logs"
          {
            go version
            python3 scripts/fuzz_differential.py --toast "$TOAST_BIN" --barn-linux bin/barn --out fuzz-differential \
              .fuzz/retained/vm/FuzzSourceExecution/inputs .fuzz/retained/compiler/FuzzCompileVerifiable/inputs \
              .fuzz/retained/vm/FuzzStructuredSourceExecution/inputs .fuzz/retained/compiler/FuzzStructuredCompileVerifiable/inputs \
              .fuzz/retained/parser/FuzzStructuredParseFormatRoundTrip/inputs \
              vm/testdata/fuzz/FuzzSourceExecution compiler/testdata/fuzz/FuzzCompileVerifiable
          } 2>&1 | tee "$logs/run-001.log"

      # Per builtin: compared programs and conformance tests. Written into the
      # evidence; the accept job fails the cycle when the builtins at zero on
      # both differ from scripts/fuzz_zero_coverage_builtins.txt.
      - name: Census builtin coverage
        if: ${{ !cancelled() && steps.campaign.outcome != 'skipped' }}
        run: |
          python3 scripts/fuzz_builtin_census.py --toast "$TOAST_BIN" --results fuzz-differential/results.json \
            --suite moo-conformance-tests --out fuzz-differential

      - name: Upload differential evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-ToastDifferential
          path: fuzz-differential/
          if-no-files-found: error
          retention-days: 30

      - *failure-reporter

  # FuzzSuspendedStackCheckpoint checkpoints and resumes its programs in one
  # Go process, where Barn reads only its own checkpoints. Here each retained
  # program is checkpointed by one engine and resumed by the other, in both
  # directions, and compared with the same program run with no restart.
  cross-engine:
    needs: [route, fuzz]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' && needs.route.outputs.campaign == 'native-and-toast' }}
    name: ToastCrossEngineCheckpoint
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 60
    env:
      BARN_FUZZ_CORPUS: ''
      FUZZ_TARGET: ToastCrossEngineCheckpoint
      FUZZ_PACKAGE: ./scripts
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download this cycle's suspended-stack corpus
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fuzz-corpus-FuzzSuspendedStackCheckpoint
          path: .fuzz/retained

      - name: Build Toast oracle
        run: bash scripts/build-toast-oracle.sh

      - name: Build Barn
        run: |
          go list -f '{{.ImportPath}} {{.Name}}' ./cmd/barn
          go build -o bin/ ./cmd/barn

      - name: Checkout moo-conformance-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: MongooseMoo/moo-conformance-tests
          path: moo-conformance-tests
          # The suite's ToastCore startup database is a git submodule.
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # The corpus holds thousands of programs at about 4 s per program and
      # direction, so each cycle runs what fits in 20 minutes, starting at a
      # place its run id picks.
      - name: Resume retained suspended stacks on the other engine
        id: campaign
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$logs"
          mkdir -p "$logs"
          {
            go version
            python3 scripts/fuzz_cross_engine.py --barn bin/barn --toast toaststunt/build/moo \
              --suite moo-conformance-tests --out fuzz-cross-engine --minutes 20 --seed "$GITHUB_RUN_ID" \
              .fuzz/retained/vm/FuzzSuspendedStackCheckpoint/inputs
          } 2>&1 | tee "$logs/run-001.log"

      - name: Upload cross-engine evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-ToastCrossEngineCheckpoint
          path: fuzz-cross-engine/
          if-no-files-found: error
          retention-days: 30

      - *failure-reporter

  accept:
    needs: [route, fuzz, differential, cross-engine]
    # Findings keep their jobs red. This job instead judges whether the cycle
    # completed measured work with its evidence kept; replenishment needs it.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' }}
    name: Accept discovery cycle
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fuzz-corpus-*
          merge-multiple: true
          path: .fuzz/retained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.route.outputs.campaign == 'native-and-toast'
        with:
          name: fuzz-failure-ToastDifferential
          path: fuzz-differential
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.route.outputs.campaign == 'native-and-toast'
        with:
          name: fuzz-failure-ToastCrossEngineCheckpoint
          path: fuzz-cross-engine
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_CAMPAIGN: ${{ needs.route.outputs.campaign }}
        with:
          script: await require('./scripts/fuzz_compute.cjs').accept({github, context, core});

  successor:
    needs: [route, accept]
    # Restart after any cycle, accepted or not, and after a cancelled one;
    # FUZZ_CONTINUOUS_ENABLED is the stop switch. GitHub sends no workflow_run
    # event when a GITHUB_TOKEN-dispatched run completes, so this job, not a
    # controller, submits the next cycle.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.compute-mode == 'dedicated-continuous' && needs.route.result == 'success' }}
    name: Submit continuous successor
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMPUTE_MODE: ${{ inputs.compute-mode }}
          FUZZ_CAMPAIGN: ${{ needs.route.outputs.campaign }}
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
          ACCEPT_RESULT: ${{ needs.accept.result }}
        with:
          retries: 3
          script: await require('./scripts/fuzz_compute.cjs').successor({github, context, core});
