name: Nightly fuzz

# Ordinary CI only replays committed fuzz inputs. This runs each target's
# coverage-guided campaign for a fixed time. A failure uploads the minimized
# input Go wrote under testdata/fuzz; commit it with its fix so CI replays it.
on:
  # Dispatched at 03:17 Mountain by the runner workstation's native task.
  # GitHub cron events were created many hours late, during the day.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The self-hosted runners share one workstation with PR CI.
      max-parallel: 2
      matrix:
        include:
          - { package: ./parser, target: FuzzParseFormatRoundTrip }
          - { package: ./compiler, target: FuzzCompileVerifiable }
          - { package: ./vm, target: FuzzSourceExecution }
          - { package: ./vm, target: FuzzRestoreVMSnapshotDoesNotPanic }
          - { package: ./bytecode, target: FuzzVerifyProgram }
          - { package: ./command, target: FuzzCommandLine }
          - { package: ./builtins, target: FuzzParseHTTPChunkedBody }
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Fuzz ${{ matrix.target }}
        id: campaign
        run: |
          set -o pipefail
          {
            go version
            go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30m -parallel=2 -timeout=40m
          } 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      - name: Upload failing input
        id: artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PACKAGE: ${{ matrix.package }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const target = process.env.FUZZ_TARGET;
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            // Checkout/setup can fail before the reporter is available.
            const report = fs.existsSync('scripts/fuzz_report.py')
              ? JSON.parse(execFileSync('python3', [
                  'scripts/fuzz_report.py', '--log', `${process.env.RUNNER_TEMP}/fuzz.log`,
                  '--package', process.env.FUZZ_PACKAGE, '--target', target,
                  '--commit', context.sha, '--campaign-outcome', process.env.CAMPAIGN_OUTCOME
                ], {encoding: 'utf8'}))
              : {kind: 'infrastructure', first_error: 'Checkout failed; inspect the failed step.',
                 signature: require('node:crypto').createHash('sha256').update(`${target}|infrastructure|unavailable`).digest('hex'), commit: context.sha,
                 go_version: 'unavailable', barn_frames: [], log_tail: ''};
            const infrastructure = report.kind === 'infrastructure';
            const title = infrastructure
              ? `Nightly fuzz infrastructure failure: ${target}`
              : `Nightly fuzz failure: ${target}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const marker = `<!-- fuzz-signature: ${report.signature} -->`;
            // A corpus can contain Markdown fences; keep its contents inside the block.
            const block = value => {
              const text = String(value ?? 'Unavailable');
              const fence = '`'.repeat(Math.max(3, ...Array.from(text.matchAll(/`+/g), m => m[0].length + 1)));
              return `${fence}text\n${text}\n${fence}`;
            };
            const body = [
              marker,
              `Target: ${process.env.FUZZ_PACKAGE}/${target}`,
              `Run: ${run}`,
              `Kind: ${report.kind}`,
              `Commit: ${report.commit}\nGo: ${report.go_version}`,
              `First error:\n${block(report.first_error)}`,
              `Top Barn frames:\n${block(report.barn_frames.map(f => `${f.function}\n  ${f.location}`).join('\n') || 'Unavailable in Go output')}`,
              `Failing input (${report.input_path || 'none recorded'}):\n${block(report.input_text)}`,
              `Bounded reproduction:\n${block(report.repro || 'No failing input recorded; inspect the log.')}`,
              `Log tail:\n${block(report.log_tail)}`,
              process.env.ARTIFACT_URL ? `Failing inputs: ${process.env.ARTIFACT_URL} (retained for 30 days).` : 'No failing-input artifact was uploaded.',
              'Preserve confirmed failing inputs with their regression fixes.'
            ].join('\n\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body
              });
            } else {
              // GITHUB_TOKEN events start no other workflows, except
              // workflow_dispatch, so dispatch the fix run explicitly.
              const {data: issue} = await github.rest.issues.create({
                ...context.repo, title, body, labels: infrastructure ? [] : ['claude-fix']
              });
              if (!infrastructure) {
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo, workflow_id: 'claude-fix.yml', ref: 'master',
                  inputs: {issue_number: String(issue.number)}
                });
              }
            }
