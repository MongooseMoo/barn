name: Nightly fuzz
run-name: Nightly fuzz / ${{ inputs.compute-mode }}${{ inputs.campaign == 'native-only' && ' / native-only' || '' }}

# Every discovery job runs in the server's dedicated runner group.
# A continuous cycle submits its own successor in its last job;
# fuzz-controller.yml only resumes a stalled chain on its schedule.
on:
  workflow_dispatch:
    inputs:
      compute-mode:
        description: Compute pool and cycle lifetime
        type: choice
        default: dedicated-once
        options: [dedicated-once, dedicated-continuous]
      campaign:
        description: Native discovery alone or with Toast comparison
        type: choice
        default: native-and-toast
        options: [native-and-toast, native-only]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-fuzz-dedicated
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch'
    name: Validate compute routing
    runs-on:
      group: barn-bug-discovery
      labels: [self-hosted, Linux, X64, barn-fuzz]
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      parallel: ${{ steps.route.outputs.parallel }}
      campaign: ${{ steps.route.outputs.campaign }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: route
        env:
          COMPUTE_MODE: ${{ inputs.compute-mode }}
          FUZZ_CAMPAIGN: ${{ inputs.campaign }}
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
        with:
          script: require('./scripts/fuzz_compute.cjs').configure({context, core});

  fuzz:
    needs: route
    name: ${{ matrix.target }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      # An isolated public-only fuzz/build cache prevents importing a runner
      # owner's private local-world corpus. Retained corpus is restored below.
      GOCACHE: ${{ github.workspace }}/.fuzz/go-cache/${{ github.run_id }}-${{ matrix.target }}
      BARN_FUZZ_CORPUS: ''
      FUZZ_TARGET: ${{ matrix.target }}
      FUZZ_PACKAGE: ${{ matrix.package }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.route.outputs.parallel) }}
      matrix:
        include:
          - { package: ./parser, target: FuzzParseFormatRoundTrip }
          - { package: ./parser, target: FuzzStructuredParseFormatRoundTrip }
          - { package: ./compiler, target: FuzzCompileVerifiable }
          - { package: ./compiler, target: FuzzStructuredCompileVerifiable }
          - { package: ./vm, target: FuzzSourceExecution }
          - { package: ./vm, target: FuzzStructuredSourceExecution }
          - { package: ./vm, target: FuzzRestoreVMSnapshotDoesNotPanic }
          - { package: ./bytecode, target: FuzzVerifyProgram }
          - { package: ./db/format, target: FuzzReadDatabase }
          - { package: ./command, target: FuzzCommandLine }
          - { package: ./builtins, target: FuzzParseHTTPChunkedBody }
          - { package: ./server, target: FuzzTCPReadInput }
          - { package: ./builtins, target: FuzzStringBuiltins }
          - { package: ./vm, target: FuzzCheckpointResumeEquivalence }
          - { package: ./vm, target: FuzzWorldCheckpointEffects }
          - { package: ./task, target: FuzzSuspensionCompletionHistory }
          - { package: ./types, target: FuzzMapUpdatesPreserveSnapshotsAndInsertionOrder }
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Restore retained public corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # matrix.package starts with ./ and actions/cache rejects a path with a
          # . segment; target names are unique, so ** finds the lane directory.
          path: |
            .fuzz/retained/**/${{ matrix.target }}/inputs
            .fuzz/retained/**/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-public-v1-${{ matrix.target }}-
      - name: Replay retained corpus into native cache
        run: |
          python3 scripts/fuzz_retention.py restore --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)"

      - name: Fuzz ${{ matrix.target }}
        id: campaign
        # Go stops a campaign at its first failing input, so start the target
        # again with the time left until the 30 minutes are used. Each finding
        # is reported, and its repair dispatched, before the next attempt.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          inputs="${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}"
          found="$RUNNER_TEMP/fuzz-found" logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$found" "$logs"
          mkdir -p "$found" "$logs" "$inputs"
          # Go replays testdata/fuzz as seeds and a failing seed stops the next
          # campaign at once, so saved inputs wait aside until the step ends.
          # Go names inputs by content hash: equal names hold equal bytes.
          trap 'find "$found" -type f -exec mv -t "$inputs" {} +' EXIT
          deadline=$((SECONDS + 1800)) run=0 status=0
          # The cycle acceptance job reads `cycle`: a saved finding is a
          # completed campaign; a failure without a saved input is not.
          while remaining=$((deadline - SECONDS)); [ "$remaining" -ge 60 ]; do
            run=$((run + 1))
            log="$logs/run-$(printf %03d "$run").log"
            if {
              go version
              # Keep the original failing seed so quarantine can remove its
              # exact bytes from the disposable cache before retrying.
              env -u GITHUB_TOKEN go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime="${remaining}s" -fuzzminimizetime=0 -parallel=6 -timeout="$((remaining + 600))s"
            } 2>&1 | tee "$log"; then
              mv "$log" "$logs/success-$(printf %03d "$run").log"
              break
            fi
            status=1
            # Go on only after a saved finding, so a broken setup cannot spin.
            input=$(python3 scripts/fuzz_report.py --log "$log" --package '${{ matrix.package }}' \
                --target '${{ matrix.target }}' --commit "$GITHUB_SHA" --campaign-outcome failure |
              python3 -c 'import json, sys; r = json.load(sys.stdin)[0]; print(r["input_path"] if r["kind"] != "infrastructure" and r["input_path"] else "")')
            if [ -z "$input" ]; then echo "cycle=infrastructure" >> "$GITHUB_OUTPUT"; exit 1; fi
            # Report now, while the exact record is still in place; the issue
            # carries it, since its artifact is uploaded only when the job ends.
            reported=()
            for prior in "$logs"/reported-*.log; do [ -e "$prior" ] && reported+=(--reported-log "$prior"); done
            python3 scripts/fuzz_report.py --log "$log" "${reported[@]}" --package '${{ matrix.package }}' \
                --target '${{ matrix.target }}' --commit "$GITHUB_SHA" --campaign-outcome failure \
                --publish --immediate > /dev/null && published=0 || published=$?
            case "$published" in
              0) mv "$log" "$logs/reported-$(printf %03d "$run").log" ;;
              3) echo "::notice::$input is too large for an issue; it is reported with its artifact when the job ends." ;;
              *) echo "::error::Reporting $input failed; Open failure issues retries it when the job ends." ;;
            esac
            python3 scripts/fuzz_retention.py quarantine --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --input "$input" --found "$found"
          done
          echo "cycle=$([ "$status" = 0 ] && echo clean || echo finding)" >> "$GITHUB_OUTPUT"
          exit "$status"


      - name: Capture public interesting inputs and execution census
        if: always()
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outputs.cycle }}
        run: |
          python3 scripts/fuzz_retention.py capture --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)" --logs "$RUNNER_TEMP/fuzz-logs" --campaign "$CAMPAIGN_OUTCOME"

      - name: Upload retained corpus and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: .fuzz/retained/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Save retained public corpus for the next host or cycle
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .fuzz/retained/**/${{ matrix.target }}/inputs
            .fuzz/retained/**/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failing input
        id: artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - &failure-reporter
        name: Open failure issues
        if: failure()
        env:
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          GITHUB_TOKEN: ${{ github.token }}
        # Reports what the campaign did not report while it ran: failures with
        # no saved finding, records too large for an issue, and retries.
        run: |
          if [ ! -f scripts/fuzz_report.py ]; then
            echo "::error::Checkout failed before the reporter was available; inspect the failed step."
            exit 1
          fi
          logs="$RUNNER_TEMP/fuzz-logs" args=()
          for log in "$logs"/run-*.log; do [ -e "$log" ] && args+=(--log "$log"); done
          for log in "$logs"/reported-*.log; do [ -e "$log" ] && args+=(--reported-log "$log"); done
          python3 scripts/fuzz_report.py "${args[@]}" --package "$FUZZ_PACKAGE" --target "$FUZZ_TARGET" \
            --commit "$GITHUB_SHA" --campaign-outcome "$CAMPAIGN_OUTCOME" --artifact-url "$ARTIFACT_URL" --publish

      - name: Remove this job's disposable build cache
        if: always()
        run: |
          expected="$GITHUB_WORKSPACE/.fuzz/go-cache/$GITHUB_RUN_ID-${{ matrix.target }}"
          [ "$GOCACHE" = "$expected" ] && [ "$GOCACHE" != / ] && rm -rf -- "$GOCACHE"

  differential:
    needs: [route, fuzz]
    # Even a native finding must preserve and replay the producers' artifacts.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' && needs.route.outputs.campaign == 'native-and-toast' }}
    # A fixed scalar job also has this name when skipped before matrix expansion.
    name: ToastDifferential
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      TOAST_BIN: ${{ github.workspace }}/toaststunt/build/moo
      BARN_FUZZ_CORPUS: ''
      FUZZ_TARGET: ToastDifferential
      FUZZ_PACKAGE: ./scripts
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Download this cycle's native producer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fuzz-corpus-*
          merge-multiple: true
          path: .fuzz/retained
      # The runner user cannot read the workstation's /root Toast build, so the
      # differential builds the oracle the manifest pins: same ref, Release,
      # and options.h checked against the manifest's config checksum.
      - name: Read Toast oracle pin
        id: toast-pin
        run: |
          python3 -c 'import json; m = json.load(open("profiles/toast/stock-wsl-testdb.json")); print("ref=" + m["implementation_ref"]); print("options=" + m["config_checksum"])' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MongooseMoo/toaststunt
          ref: ${{ steps.toast-pin.outputs.ref }}
          path: toaststunt
          persist-credentials: false

      - name: Build Toast oracle and Barn
        env:
          OPTIONS_SHA256: ${{ steps.toast-pin.outputs.options }}
        run: |
          echo "$OPTIONS_SHA256  toaststunt/src/include/options.h" | sha256sum -c -
          # CMakeLists.txt generates version_options.h in cmake's working
          # directory, which must be the build directory to be included.
          mkdir toaststunt/build
          (cd toaststunt/build && cmake -DCMAKE_BUILD_TYPE=Release .. && cmake --build . -j2)
          go list -f '{{.ImportPath}} {{.Name}}' ./cmd/barn
          go build -o bin/ ./cmd/barn


      - name: Compare retained public source on Barn and Toast
        id: campaign
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$logs"
          mkdir -p "$logs"
          {
            go version
            python3 scripts/fuzz_differential.py --toast "$TOAST_BIN" --barn-linux bin/barn --out fuzz-differential \
              .fuzz/retained/vm/FuzzSourceExecution/inputs .fuzz/retained/compiler/FuzzCompileVerifiable/inputs \
              .fuzz/retained/vm/FuzzStructuredSourceExecution/inputs .fuzz/retained/compiler/FuzzStructuredCompileVerifiable/inputs \
              .fuzz/retained/parser/FuzzStructuredParseFormatRoundTrip/inputs \
              vm/testdata/fuzz/FuzzSourceExecution compiler/testdata/fuzz/FuzzCompileVerifiable
          } 2>&1 | tee "$logs/run-001.log"

      - name: Upload differential evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-ToastDifferential
          path: fuzz-differential/
          if-no-files-found: error
          retention-days: 30

      - *failure-reporter

  accept:
    needs: [route, fuzz, differential]
    # Findings keep their jobs red. This job instead judges whether the cycle
    # completed measured work with its evidence kept; replenishment needs it.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' }}
    name: Accept discovery cycle
    permissions:
      contents: read
      actions: read
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fuzz-corpus-*
          merge-multiple: true
          path: .fuzz/retained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.route.outputs.campaign == 'native-and-toast'
        with:
          name: fuzz-failure-ToastDifferential
          path: fuzz-differential
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_CAMPAIGN: ${{ needs.route.outputs.campaign }}
        with:
          script: await require('./scripts/fuzz_compute.cjs').accept({github, context, core});

  successor:
    needs: [route, accept]
    # Restart after any cycle, accepted or not, and after a cancelled one;
    # FUZZ_CONTINUOUS_ENABLED is the stop switch. GitHub sends no workflow_run
    # event when a GITHUB_TOKEN-dispatched run completes, so this job, not a
    # controller, submits the next cycle.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.compute-mode == 'dedicated-continuous' && needs.route.result == 'success' }}
    name: Submit continuous successor
    permissions:
      contents: read
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMPUTE_MODE: ${{ inputs.compute-mode }}
          FUZZ_CAMPAIGN: ${{ needs.route.outputs.campaign }}
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
          ACCEPT_RESULT: ${{ needs.accept.result }}
        with:
          retries: 3
          script: await require('./scripts/fuzz_compute.cjs').successor({github, context, core});
