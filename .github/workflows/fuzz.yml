name: Nightly fuzz
run-name: Nightly fuzz / ${{ github.event_name == 'workflow_run' && 'controller' || inputs.compute-mode }}

# Workstation Task Scheduler continues dispatching the default legacy mode at
# 03:17 Mountain. Dedicated modes use only the explicitly verified runner group.
on:
  workflow_run:
    workflows: [Nightly fuzz]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      compute-mode:
        description: Compute pool and cycle lifetime
        type: choice
        default: legacy
        options: [legacy, dedicated-once, dedicated-continuous]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly-fuzz-${{ github.event_name == 'workflow_run' && 'controller' || inputs.compute-mode == 'legacy' && 'legacy' || 'dedicated' }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch'
    name: Validate compute routing
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      parallel: ${{ steps.route.outputs.parallel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: route
        env:
          COMPUTE_MODE: ${{ inputs.compute-mode }}
          CI_RUNNER_LABELS: ${{ vars.CI_RUNNER_LABELS }}
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
        with:
          script: require('./scripts/fuzz_compute.cjs').configure({context, core});

  fuzz:
    needs: route
    name: ${{ matrix.target }}
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      # An isolated public-only fuzz/build cache prevents importing a runner
      # owner's private local-world corpus. Retained corpus is restored below.
      GOCACHE: ${{ github.workspace }}/.fuzz/go-cache/${{ github.run_id }}-${{ matrix.target }}
      BARN_FUZZ_CORPUS: ''
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.route.outputs.parallel) }}
      matrix:
        include:
          - { package: ./parser, target: FuzzParseFormatRoundTrip }
          - { package: ./parser, target: FuzzStructuredParseFormatRoundTrip }
          - { package: ./compiler, target: FuzzCompileVerifiable }
          - { package: ./compiler, target: FuzzStructuredCompileVerifiable }
          - { package: ./vm, target: FuzzSourceExecution }
          - { package: ./vm, target: FuzzStructuredSourceExecution }
          - { package: ./vm, target: FuzzRestoreVMSnapshotDoesNotPanic }
          - { package: ./bytecode, target: FuzzVerifyProgram }
          - { package: ./db/format, target: FuzzReadDatabase }
          - { package: ./command, target: FuzzCommandLine }
          - { package: ./builtins, target: FuzzParseHTTPChunkedBody }
          - { package: ./server, target: FuzzTCPReadInput }
          - { package: ./builtins, target: FuzzStringBuiltins }
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Restore retained public corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .fuzz/retained/${{ matrix.package }}/${{ matrix.target }}/inputs
            .fuzz/retained/${{ matrix.package }}/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-public-v1-${{ matrix.target }}-
      - name: Replay retained corpus into native cache
        run: |
          python3 scripts/fuzz_retention.py restore --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)"

      - name: Fuzz ${{ matrix.target }}
        id: campaign
        # Go stops a campaign at its first failing input, so start the target
        # again with the time left until the 30 minutes are used.
        run: |
          set -o pipefail
          inputs="${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}"
          found="$RUNNER_TEMP/fuzz-found" logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$found" "$logs"
          mkdir -p "$found" "$logs" "$inputs"
          # Go replays testdata/fuzz as seeds and a failing seed stops the next
          # campaign at once, so saved inputs wait aside until the step ends.
          # Go names inputs by content hash: equal names hold equal bytes.
          trap 'find "$found" -type f -exec mv -t "$inputs" {} +' EXIT
          deadline=$((SECONDS + 1800)) run=0 status=0
          while remaining=$((deadline - SECONDS)); [ "$remaining" -ge 60 ]; do
            run=$((run + 1))
            log="$logs/run-$(printf %03d "$run").log"
            if {
              go version
              go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime="${remaining}s" -parallel=2 -timeout="$((remaining + 600))s"
            } 2>&1 | tee "$log"; then
              mv "$log" "$logs/success-$(printf %03d "$run").log"
              break
            fi
            status=1
            # Go on only after a saved finding, so a broken setup cannot spin.
            input=$(python3 scripts/fuzz_report.py --log "$log" --package '${{ matrix.package }}' \
                --target '${{ matrix.target }}' --commit "$GITHUB_SHA" --campaign-outcome failure |
              python3 -c 'import json, sys; r = json.load(sys.stdin)[0]; print(r["input_path"] if r["kind"] != "infrastructure" and r["input_path"] else "")')
            [ -n "$input" ] || break
            mv "$input" "$found/"
          done
          exit "$status"


      - name: Capture public interesting inputs and execution census
        if: always()
        run: |
          python3 scripts/fuzz_retention.py capture --cache "$GOCACHE" --package '${{ matrix.package }}' --target '${{ matrix.target }}' --head "$GITHUB_SHA" --go-version "$(go version)" --logs "$RUNNER_TEMP/fuzz-logs"

      - name: Upload retained corpus and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: .fuzz/retained/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Save retained public corpus for the next host or cycle
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .fuzz/retained/${{ matrix.package }}/${{ matrix.target }}/inputs
            .fuzz/retained/${{ matrix.package }}/${{ matrix.target }}/manifest.json
          key: fuzz-public-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failing input
        id: artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      - &failure-reporter
        name: Open failure issues
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PACKAGE: ${{ matrix.package }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        with:
          script: |
            const target = process.env.FUZZ_TARGET;
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            // One log per failed campaign, named so that sorting gives run order.
            const logs = `${process.env.RUNNER_TEMP}/fuzz-logs`;
            const logArgs = fs.existsSync(logs) ? fs.readdirSync(logs).filter(name => name.startsWith('run-')).sort().flatMap(name => ['--log', `${logs}/${name}`]) : [];
            // Checkout/setup can fail before the reporter is available.
            const reports = fs.existsSync('scripts/fuzz_report.py')
              ? JSON.parse(execFileSync('python3', [
                  'scripts/fuzz_report.py', ...logArgs,
                  '--package', process.env.FUZZ_PACKAGE, '--target', target,
                  '--commit', context.sha, '--campaign-outcome', process.env.CAMPAIGN_OUTCOME
                ], {encoding: 'utf8'}))
              : [{kind: 'infrastructure', first_error: 'Checkout failed; inspect the failed step.',
                 signature: require('node:crypto').createHash('sha256').update(`${target}|infrastructure|unavailable`).digest('hex'), commit: context.sha,
                 go_version: 'unavailable', barn_frames: [], log_tail: '', count: 1}];
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            // A corpus can contain Markdown fences; keep its contents inside the block.
            const block = value => {
              const text = String(value ?? 'Unavailable');
              const fence = '`'.repeat(Math.max(3, ...Array.from(text.matchAll(/`+/g), m => m[0].length + 1)));
              return `${fence}text\n${text}\n${fence}`;
            };
            // One issue or comment per distinct signature found in the night.
            for (const report of reports) {
              const infrastructure = report.kind === 'infrastructure';
              const title = infrastructure
                ? `Nightly fuzz infrastructure failure: ${target}`
                : `Nightly fuzz failure: ${target}`;
              const marker = `<!-- fuzz-signature: ${report.signature} -->`;
              const body = [
                marker,
                `Target: ${process.env.FUZZ_PACKAGE}/${target}`,
                `Run: ${run}`,
                `Kind: ${report.kind}`,
                `Times found in this run's campaigns: ${report.count} (the input below is from the first; the artifact holds every saved input).`,
                `Commit: ${report.commit}\nGo: ${report.go_version}`,
                `First error:\n${block(report.first_error)}`,
                `Top Barn frames:\n${block(report.barn_frames.map(f => `${f.function}\n  ${f.location}`).join('\n') || 'Unavailable in Go output')}`,
                `Failing input (${report.input_path || 'none recorded'}):\n${block(report.input_text)}`,
                `Bounded reproduction:\n${block(report.repro || 'No failing input recorded; inspect the log.')}`,
                `Log tail:\n${block(report.log_tail)}`,
                process.env.ARTIFACT_URL ? `Failing inputs: ${process.env.ARTIFACT_URL} (retained for 30 days).` : 'No failing-input artifact was uploaded.',
                'Preserve confirmed failing inputs with their regression fixes.'
              ].join('\n\n');
              const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number, body
                });
              } else {
                // GITHUB_TOKEN events start no other workflows, except
                // workflow_dispatch, so dispatch the fix run explicitly.
                const {data: issue} = await github.rest.issues.create({
                  ...context.repo, title, body, labels: infrastructure ? [] : ['claude-fix']
                });
                if (!infrastructure) {
                  await github.rest.actions.createWorkflowDispatch({
                    ...context.repo, workflow_id: 'claude-fix.yml', ref: 'master',
                    inputs: {issue_number: String(issue.number)}
                  });
                }
              }
            }

      - name: Remove this job's disposable build cache
        if: always()
        run: |
          expected="$GITHUB_WORKSPACE/.fuzz/go-cache/$GITHUB_RUN_ID-${{ matrix.target }}"
          [ "$GOCACHE" = "$expected" ] && [ "$GOCACHE" != / ] && rm -rf -- "$GOCACHE"

  differential:
    needs: [route, fuzz]
    # Even a native finding must preserve and replay the producers' artifacts.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.route.result == 'success' }}
    name: ToastDifferential
    permissions:
      contents: read
      issues: write
      actions: write
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    timeout-minutes: 45
    env:
      TOAST_BIN: ${{ github.workspace }}/toaststunt/build/moo
      BARN_FUZZ_CORPUS: ''
    strategy:
      matrix:
        include:
          - {package: ./scripts, target: ToastDifferential}
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false


      - name: Download this cycle's native producer artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fuzz-corpus-*
          merge-multiple: true
          path: .fuzz/retained
      # The runner user cannot read the workstation's /root Toast build, so the
      # differential builds the oracle the manifest pins: same ref, Release,
      # and options.h checked against the manifest's config checksum.
      - name: Read Toast oracle pin
        id: toast-pin
        run: |
          python3 -c 'import json; m = json.load(open("profiles/toast/stock-wsl-testdb.json")); print("ref=" + m["implementation_ref"]); print("options=" + m["config_checksum"])' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MongooseMoo/toaststunt
          ref: ${{ steps.toast-pin.outputs.ref }}
          path: toaststunt
          persist-credentials: false

      - name: Build Toast oracle and Barn
        env:
          OPTIONS_SHA256: ${{ steps.toast-pin.outputs.options }}
        run: |
          echo "$OPTIONS_SHA256  toaststunt/src/include/options.h" | sha256sum -c -
          # CMakeLists.txt generates version_options.h in cmake's working
          # directory, which must be the build directory to be included.
          mkdir toaststunt/build
          (cd toaststunt/build && cmake -DCMAKE_BUILD_TYPE=Release .. && cmake --build . -j2)
          go list -f '{{.ImportPath}} {{.Name}}' ./cmd/barn
          go build -o bin/ ./cmd/barn


      - name: Compare retained public source on Barn and Toast
        id: campaign
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/fuzz-logs"
          rm -rf "$logs"
          mkdir -p "$logs"
          {
            go version
            python3 scripts/fuzz_differential.py --toast "$TOAST_BIN" --barn-linux bin/barn --out fuzz-differential \
              .fuzz/retained/vm/FuzzSourceExecution/inputs .fuzz/retained/compiler/FuzzCompileVerifiable/inputs \
              vm/testdata/fuzz/FuzzSourceExecution compiler/testdata/fuzz/FuzzCompileVerifiable
          } 2>&1 | tee "$logs/run-001.log"

      - name: Upload differential evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-ToastDifferential
          path: fuzz-differential/
          if-no-files-found: error
          retention-days: 30

      - *failure-reporter

  replenish:
    # Controller completions are ineligible: only successful source dispatches
    # can replenish. A failed/inconclusive cycle never submits a successor.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.display_title == 'Nightly fuzz / dedicated-continuous' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.FUZZ_CONTINUOUS_ENABLED == 'true'
    runs-on:
      group: barn-bug-discovery
      labels: ${{ fromJSON(vars.FUZZ_RUNNER_LABELS || '[]') }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FUZZ_RUNNER_LABELS: ${{ vars.FUZZ_RUNNER_LABELS }}
          FUZZ_RUNNER_POLICY_VERIFIED: ${{ vars.FUZZ_RUNNER_POLICY_VERIFIED }}
          FUZZ_MAX_PARALLEL: ${{ vars.FUZZ_MAX_PARALLEL }}
          FUZZ_CONTINUOUS_ENABLED: ${{ vars.FUZZ_CONTINUOUS_ENABLED }}
        with:
          script: await require('./scripts/fuzz_compute.cjs').replenish({github, context, core});
