name: Automatic repair
run-name: "Repair #${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number }} / ${{ inputs.provider || 'auto' }}"

# Runs Claude Code on one issue and leaves a pull request for review.
# Nightly fuzz dispatches this for each newly opened failure issue, as soon as
# a lane saves the finding (or when its job ends for a record too large to
# carry in the issue): issues it
# opens with GITHUB_TOKEN start no `issues` workflows, but workflow_dispatch is
# exempt. A maintainer can also start it by adding the `claude-fix` label.
# Its pull requests carry the `automatic-fix` label. Before a repair can merge,
# a second Claude run writes a MOO conformance test for the fixed behaviour and
# runs it on Toast and on the repair's Barn; the test goes to a pull request in
# moo-conformance-tests, whose CI runs it on Toast. When that run writes a
# test, this workflow runs the test itself with the managed harness on Toast,
# on Barn built at the merge base and on Barn built at the repair's head, and
# records the three results as the scope rule's conformance evidence. A repair
# then enters the merge queue with no person reading it when these hold:
#   - scripts/automatic_fix_scope.py, taken from master, finds it in scope
#     (a fuzz input replayed red/green, or that conformance evidence);
#   - Toast did not disagree with the fixed behaviour;
#   - the validated head passed its required checks. The repairing run waits and
#     fixes what its change broke before it ends.
# Otherwise it stays open with the `needs-decision` label and the reasons.
# When the repair merges, the conformance job merges its conformance pull
# request; when it closes unmerged, the conformance pull request is closed.
# Any other merged pull request carrying `automatic-fix` (one a person or
# another agent labelled) gets its conformance test written after the merge.
#
# A short Claude invocation enqueues the admitted head with its own token: a
# queue entry made with GITHUB_TOKEN does not start merge_group workflows.
# The admitted head waits for its own checks without arming auto-merge.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to fix
        required: true
        type: string
      provider:
        description: Provider to use for the repair
        type: choice
        options: [auto, claude, codex]
        default: auto
      stage:
        description: Use conformance with an existing repair PR number
        type: choice
        options: [repair, conformance]
        default: repair
  issues:
    types: [labeled]
  pull_request:
    types: [closed, dequeued]

permissions:
  contents: read

concurrency:
  group: claude-fix-${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: (github.event_name == 'workflow_dispatch' && inputs.stage != 'conformance') || github.event.label.name == 'claude-fix'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Two Claude runs: the repair, then its Toast check.
    timeout-minutes: 420
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
    steps:
      - name: Check issue number
        run: '[[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue_number must be a number"; exit 1; }'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route the repair
        id: route
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.ISSUE }}
          stage: repair
          provider: ${{ inputs.provider || 'auto' }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.route.outputs.provider == 'claude'
        with:
          repository: MongooseMoo/moo-conformance-tests
          path: moo-conformance-tests
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.route.outputs.provider == 'claude'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.route.outputs.provider == 'claude'

      # Claude's installer writes under $HOME, which the runners on one host
      # share: a run installing while another ran the downloaded installer
      # binary failed with "Text file busy". Each run installs into its own
      # temporary home, and the action uses that binary instead of installing.
      - name: Install Claude Code for this run
        if: steps.route.outputs.provider == 'claude'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | HOME="$RUNNER_TEMP/claude-home" bash

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        if: steps.route.outputs.provider == 'claude'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: &claude-bin ${{ runner.temp }}/claude-home/.local/bin/claude
          # Nightly fuzz dispatches as github-actions[bot].
          allowed_bots: github-actions,mongoosemoo-barn-repair-worker
          settings: .github/claude-fix-settings.json
          prompt: |
            Fix GitHub issue #${{ env.ISSUE }} in ${{ github.repository }} and open a pull request for review.

            Read CLAUDE.md and AGENTS.md first and follow them. The conformance suite is checked out at
            ./moo-conformance-tests; the CI workflow .github/workflows/ci.yml shows the managed conformance
            command, and the WSL Toast oracle on this runner is the behavioural reference.

            All runners share a Unix user. Never kill processes by name or pattern: that kills other
            jobs' tests too. Start potentially hanging reproductions with timeout, and clean up only
            PIDs you started. The Bash hook blocks process-name kills; do not bypass it.

            For a memory leak or retained-growth issue, recreate the exact record at the relative path named in the issue and use its BARN_LEAK_INPUT/BARN_LEAK_OUTPUT reproduction command, including an independent second process. A passing single native fuzz invocation does not test this finding. Keep the record outside testdata/fuzz unless it also fails the ordinary fuzz target before the fix. Add a regression that repeats the failing lifecycle and checks cleanup; preserve the raw sample series and profiles. Other fuzz failures continue through the existing instructions below.

            1. Read the issue: `gh issue view ${{ env.ISSUE }} --comments`. For other fuzz failures, recreate the
               input it names in <package>/testdata/fuzz/<Target>/. Fuzz lanes report a finding while they are
               still running, so the issue body normally holds the exact record in a base64 block: decode that
               block's contents with `base64 -d` into the path the issue names, and check `sha256sum` against the
               issue. Only if the issue has no such block, download its failing inputs with
               `gh run download <run-id> -n fuzz-failure-<target>` from the linked run (uploaded when that job
               ends) and copy the named input. Then reproduce with
               `timeout --kill-after=5s 60s go test <package> -run '<Target>/<input-file>'`.
               The artifact can hold inputs for other failures found the same night; use only this issue's input.
               This checkout is current master. If the recorded input passes here, replay it at the commit the
               issue names before concluding anything (`git worktree add --detach <dir> <commit>`, then the same
               command there): a merge after that commit can change what the same bytes mean (a changed
               generator or harness), so a pass on master alone does not show the bug is gone. If it fails at
               the issue's commit and no merged change fixed the cause, the bug is still on master: print the
               program or operations the input produced at that commit, reproduce those on this checkout, and
               continue with step 2, pinning the bug in step 3 with a test written from that program instead
               of the input. Only if the bug itself is gone (already fixed on master, or a
               duplicate of an issue that a merged fix closed), open no PR: use your one allowed issue comment
               (`gh issue comment ${{ env.ISSUE }} --body-file <file>`) for the evidence (the input's sha256, the
               reproduction command and its passing output, and the fixing PR or commit if you can name it), then
               close the issue with `gh issue close ${{ env.ISSUE }} --reason completed`, and stop. If your
               evidence shows the failure is not a Barn defect (for example a stall or fault of the runner host,
               with the input passing under the bounded reproduction), post that evidence the same way, close the
               issue with `gh issue close ${{ env.ISSUE }} --reason "not planned"`, and stop.
            2. Before fixing, check for the same bug already filed or being fixed. One bug can appear under two
               fuzz signatures (for example two hangs, or a different top frame). List open issues with
               `gh issue list --state open --search '"Nightly fuzz failure" in:title'` and open PRs from
               claude/issue-* or codex/issue-* branches with `gh pr list --state open --json number,title,headRefName`, and read
               each one's cause. If one has the same root cause as this issue (the same cause at the same
               file:line, not only the same fuzz target), open no PR: use your one allowed issue comment
               (`gh issue comment ${{ env.ISSUE }} --body-file <file>`) to link that issue or PR with the
               evidence (the shared file:line, and the reproduction output of this issue's input), and stop.
            3. Find the cause in the code and make the smallest production fix. For other fuzz failures, commit the failing input under
               testdata/fuzz with the fix so ordinary CI replays it, but only an input that fails on this
               checkout without your fix: CI (scripts/fuzz_red_green.py) refuses an added input that passes
               before the change. Never weaken, skip or delete a test or check.
            4. Run the affected package's tests.
            5. Create branch claude/issue-${{ env.ISSUE }}, commit, push, and open the PR against master with
               `gh pr create --label automatic-fix`. The body says what failed, the cause with file:line, the fix, and "Fixes #${{ env.ISSUE }}".
               Include a "Known related gaps" section listing related defects you noticed but did not fix,
               with file:line and evidence; write "None noticed" if there are none. Do not omit an unfixed
               defect just because it is outside this issue's scope.
               Do not add attribution trailers to commits or attribution footers to the PR body.
               Stage named paths only, never `git add -A`.
            6. Stay with the pull request until its checks have finished. Poll `gh pr checks <number>` about
               once a minute (keep each waiting command under nine minutes) until none is pending. If one
               failed, read its log (`gh run view <run-id> --log-failed`), fix what your change got wrong on
               the same branch, push, and wait again; at most three such rounds. Never make a check pass by
               weakening it. If a check still fails, or fails for a reason your change did not cause, leave
               the pull request open and add a "Failing checks" section to its body (`gh api -X PATCH
               repos/${{ github.repository }}/pulls/<number> -F body=@<file>`; this runner's `gh pr edit`
               fails) with the check, the log lines and what you tried.
            7. If you cannot find or fix the cause, open no PR. Instead post one comment on the issue with
               `gh issue comment ${{ env.ISSUE }} --body-file <file>` so the next attempt can build on it:
               whether and how you reproduced the failure, each hypothesis you tested and the evidence that
               ruled it in or out (file:line, command, output), what is established, what is still unknown, and
               the next step you would take. Before that comment, read the issue's earlier comments and do not
               repeat work they already record.

            Post nothing else: no other comments and no reviews. Close the issue only as step 1 says.
          claude_args: &claude-args |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Classify and route Claude repair failure
        if: failure() && steps.claude.outcome == 'failure'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.ISSUE }}
          stage: repair
          provider: claude-failed
          execution_file: ${{ steps.claude.outputs.execution_file }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      # GitHub closes the issue on merge only when the PR body, not its title,
      # says "Fixes #N"; #696 named #692 only in its title, so #692 stayed open.
      # The body is read because the runner's gh has no closingIssuesReferences
      # field: for #723 it printed "Unknown JSON field" inside the for loop's
      # $(...), the step passed, and #722 stayed open. The query is assigned
      # first so that a failed query fails the step. The body is written with
      # the REST API: that gh's `pr edit` also reads classic project cards,
      # which GitHub has retired, so for #842 it exited 1 on "Projects
      # (classic) is being deprecated", the body kept no "Fixes #841", the
      # steps after this one were skipped and #841 stayed open.
      - name: Make the pull request close its issue
        if: steps.route.outputs.provider == 'claude'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$GH_REPO/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:claude/issue-$ISSUE" --jq '.[] | select(.body // "" |
            test("(?i)(^|[^a-z0-9_])(close[sd]?|fix(e[sd])?|resolve[sd]?):? #" + env.ISSUE + "([^0-9]|$)") | not) | .number')
          for n in $prs; do
            gh api "repos/$GH_REPO/pulls/$n" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
            printf '\nFixes #%s\n' "$ISSUE" >> "$RUNNER_TEMP/pr-body.md"
            gh api -X PATCH "repos/$GH_REPO/pulls/$n" -F "body=@$RUNNER_TEMP/pr-body.md" --silent
          done

      # The runner's gh is 2.23, so these steps call the REST and GraphQL APIs
      # rather than newer gh subcommands and JSON fields.
      - name: Find the repair pull request
        if: steps.route.outputs.provider == 'claude'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf conformance-pr
          found="repos/$GH_REPO/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:claude/issue-$ISSUE"
          number=$(gh api "$found" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open pull request from claude/issue-$ISSUE; nothing to queue."
            exit 0
          fi
          head=$(gh api "repos/$GH_REPO/pulls/$number" --jq .head.sha)
          node=$(gh api "repos/$GH_REPO/pulls/$number" --jq .node_id)
          # Claude committed the repair in this checkout before pushing it.
          git checkout --detach "$head"
          {
            echo "number=$number"
            echo "head=$head"
            echo "node=$node"
          } >> "$GITHUB_OUTPUT"

      # The rule comes from master, not from the repair, so a repair cannot
      # change the rule that judges it.
      - name: Check the repair's scope
        id: scope
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          base=$(git merge-base FETCH_HEAD HEAD)
          mkdir -p "$RUNNER_TEMP/trusted"
          git archive FETCH_HEAD scripts/automatic_fix_scope.py scripts/fuzz_red_green.py | tar -x -C "$RUNNER_TEMP/trusted"
          in_scope=true
          python3 "$RUNNER_TEMP/trusted/scripts/automatic_fix_scope.py" --base "$base" > "$RUNNER_TEMP/scope.txt" || in_scope=false
          cat "$RUNNER_TEMP/scope.txt"
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Route conformance
        id: conformance_route
        if: steps.pr.outputs.number
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ steps.pr.outputs.number }}
          stage: conformance
          provider: ${{ inputs.provider || 'auto' }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      - name: Write the conformance test and check the repair against Toast
        if: steps.conformance_route.outputs.provider == 'claude'
        id: toast
        uses: $/.github/actions/conformance-test
        with:
          pr: ${{ steps.pr.outputs.number }}
          merged: 'false'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_bin: *claude-bin
          claude_args: *claude-args
          conformance_pr_token: ${{ secrets.CONFORMANCE_PR_TOKEN }}

      - name: Classify and route Claude conformance failure
        id: toast_handoff
        if: failure() && steps.toast.outcome == 'failure'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ steps.pr.outputs.number }}
          stage: conformance
          provider: claude-failed
          execution_file: ${{ steps.toast.outputs.execution_file }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      # The provider's claim is not the proof. Test its exact published
      # candidate with the same managed runner used for Codex companions.
      - name: Run the conformance test on Toast, the merge base and the head
        id: proof
        if: steps.toast.outputs.outcome == 'test'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          suite=$(gh api "repos/MongooseMoo/moo-conformance-tests/pulls?state=open&head=MongooseMoo:barn-fix/pr-$PR&base=main" --jq '.[0].head.sha // empty')
          git show "$GITHUB_SHA:scripts/repair-conformance-proof.sh" > "$RUNNER_TEMP/repair-conformance-proof.sh"
          env -u GH_TOKEN bash "$RUNNER_TEMP/repair-conformance-proof.sh" "$BASE" "$HEAD_SHA" "$suite" moo-conformance-tests
          echo "suite=$suite" >> "$GITHUB_OUTPUT"

      # The same trusted rule as "Check the repair's scope", now given the
      # conformance evidence.
      - name: Check the repair's scope with the conformance evidence
        id: proof_scope
        if: always() && steps.toast.outputs.outcome == 'test'
        env:
          BASE: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          SUITE_HEAD: ${{ steps.proof.outputs.suite }}
        run: |
          set -euo pipefail
          in_scope=true
          python3 "$RUNNER_TEMP/trusted/scripts/automatic_fix_scope.py" --base "$BASE" --head "$HEAD_SHA" \
            --suite-head "$SUITE_HEAD" \
            --conformance-evidence "$RUNNER_TEMP/conformance-evidence.json" > "$RUNNER_TEMP/scope.txt" || in_scope=false
          cat "$RUNNER_TEMP/scope.txt"
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks on the validated repair head
        if: always() && steps.conformance_route.outputs.provider == 'claude' && steps.toast_handoff.outputs.provider != 'codex'
        id: queue
        timeout-minutes: 185
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          IN_SCOPE: ${{ steps.proof_scope.outputs.in_scope || steps.scope.outputs.in_scope }}
          TOAST_STEP: ${{ steps.toast.outcome }}
          OUTCOME: ${{ steps.toast.outputs.outcome }}
          PROOF_STEP: ${{ steps.proof.outcome }}
          SUITE_HEAD: ${{ steps.proof.outputs.suite }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          state=$(jq -r '.state' <<< "$pr")
          [ "$state" = open ] || { echo "Repair #$PR is already $state."; exit 0; }
          head_now=$(jq -r '.head.sha' <<< "$pr")
          reasons="$RUNNER_TEMP/not-queued.md"
          : > "$reasons"
          if [ "$IN_SCOPE" != true ]; then
            { echo "Out of scope for an unread merge:"; sed 's/^/- /' "$RUNNER_TEMP/scope.txt"; } >> "$reasons"
          fi
          if [ "$TOAST_STEP" != success ]; then
            echo "The Toast check did not finish ($TOAST_STEP); see this run's log." >> "$reasons"
          elif [ "$OUTCOME" = toast-disagrees ]; then
            echo "Toast disagrees with the fixed behaviour; see the Toast and Barn output above." >> "$reasons"
          elif [ "$OUTCOME" = test ] && [ "$PROOF_STEP" != success ]; then
            echo "The managed conformance proof did not finish ($PROOF_STEP); see this run's log." >> "$reasons"
          fi
          [ "$head_now" = "$HEAD_SHA" ] || echo "The repair head moved after validation." >> "$reasons"
          if [ "$OUTCOME" = test ] && [ "$PROOF_STEP" = success ]; then
            suite_now=$(gh api "repos/MongooseMoo/moo-conformance-tests/pulls?state=open&head=MongooseMoo:barn-fix/pr-$PR&base=main" --jq '.[0].head.sha // empty')
            [ "$suite_now" = "$SUITE_HEAD" ] || echo "The companion head moved after validation." >> "$reasons"
          fi
          if [ ! -s "$reasons" ]; then
            script="$RUNNER_TEMP/repair_completion.py"
            git show "$GITHUB_SHA:scripts/repair_completion.py" > "$script"
            if verdict=$(python3 "$script" "$PR" --barn-head "$HEAD_SHA" --suite-head "$SUITE_HEAD" 2>&1); then
              if [ "$verdict" = ready ]; then
                echo "eligible=true" >> "$GITHUB_OUTPUT"
              else
                echo "Repair #$PR is already $verdict."
              fi
              exit 0
            fi
            printf '%s\n' "$verdict" >> "$reasons"
          fi
          cat "$reasons"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f 'labels[]=needs-decision' --silent
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$reasons" --silent

      - name: Enqueue the validated repair head
        if: steps.queue.outputs.eligible == 'true'
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: *claude-bin
          allowed_bots: github-actions,mongoosemoo-barn-repair-worker
          settings: .github/claude-fix-settings.json
          prompt: |
            Run exactly this one command, once, and nothing else. Post nothing, then stop:
            gh api graphql -f query='mutation($id: ID!, $head: GitObjectID!) { enqueuePullRequest(input: {pullRequestId: $id, expectedHeadOid: $head}) { mergeQueueEntry { id } } }' -f id='${{ steps.pr.outputs.node }}' -f head='${{ steps.pr.outputs.head }}'
          claude_args: *claude-args

      - name: Report the queue handoff
        if: always() && steps.queue.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ steps.pr.outputs.node }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          gh api graphql -f id="$NODE" -f query='query($id: ID!) { node(id: $id) { ... on PullRequest {
            state headRefOid isInMergeQueue
          } } }' --jq '.data.node' |
            jq -e --arg head "$HEAD_SHA" 'select(.headRefOid == $head) |
              if .state == "MERGED" then "merged"
              elif .isInMergeQueue then "queued; merge-group checks own the verdict"
              else empty end' | tee -a "$GITHUB_STEP_SUMMARY"

  repair_dequeued:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'dequeued' &&
      contains(github.event.pull_request.labels.*.name, 'automatic-fix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Record the merge-queue removal
        env:
          GH_TOKEN: ${{ github.token }}
          NODE: ${{ github.event.pull_request.node_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          event=$(gh api graphql -f id="$NODE" -f query='query($id: ID!) { node(id: $id) { ... on PullRequest {
            state timelineItems(itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT], last: 1) { nodes {
              ... on RemovedFromMergeQueueEvent { reason beforeCommit { oid } }
            } }
          } } }' --jq '.data.node')
          reason=$(jq -r '.timelineItems.nodes[0].reason // "unknown"' <<< "$event")
          sha=$(jq -r '.timelineItems.nodes[0].beforeCommit.oid // empty' <<< "$event")
          printf 'Repair #%s queue removal: %s\n' "$PR" "$reason" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$reason" = failed_checks ]; then
            if [ -n "$sha" ]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100&filter=latest" \
                --jq '.check_runs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required") | "- [" + .name + "](" + .html_url + ")"' |
                tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

  resume_conformance:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'conformance'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the repair PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          jq -e '.head.repo.full_name == .base.repo.full_name and .base.ref == "master" and (.merged or .state == "open")' <<< "$pr" > /dev/null
          jq -r '"merged=\(.merged)\nhead=\(if .merged then .merge_commit_sha else .head.sha end)"' <<< "$pr" >> "$GITHUB_OUTPUT"
      - name: Route the existing repair PR
        id: route
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ inputs.issue_number }}
          stage: conformance
          provider: ${{ inputs.provider }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.route.outputs.provider == 'claude'
        with:
          repository: MongooseMoo/moo-conformance-tests
          path: moo-conformance-tests
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.route.outputs.provider == 'claude'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.route.outputs.provider == 'claude'
      - name: Install Claude and check out the exact repair
        if: steps.route.outputs.provider == 'claude'
        env:
          REPAIR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$REPAIR_HEAD"
          git checkout --detach "$REPAIR_HEAD"
          curl -fsSL https://claude.ai/install.sh | HOME="$RUNNER_TEMP/claude-home" bash
      - name: Verify conformance at the repair head
        id: resume_toast
        if: steps.route.outputs.provider == 'claude'
        uses: $/.github/actions/conformance-test
        with:
          pr: ${{ inputs.issue_number }}
          merged: ${{ steps.pr.outputs.merged }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_bin: *claude-bin
          claude_args: *claude-args
          conformance_pr_token: ${{ secrets.CONFORMANCE_PR_TOKEN }}

      - name: Classify and route resumed conformance failure
        if: failure() && steps.resume_toast.outcome == 'failure'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ inputs.issue_number }}
          stage: conformance
          provider: claude-failed
          execution_file: ${{ steps.resume_toast.outputs.execution_file }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

  conformance:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automatic-fix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      FIXED_PR: ${{ github.event.pull_request.number }}
      MERGED: ${{ github.event.pull_request.merged }}
      SUITE: MongooseMoo/moo-conformance-tests
      # A repair from the fix job had its test written before it merged. Any
      # other merged pull request carrying the label gets its test written now.
      WRITE_TEST: ${{ github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'claude/issue-') && !startsWith(github.event.pull_request.head.ref, 'codex/issue-') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.WRITE_TEST == 'true'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Route conformance for the merged repair
        id: merged_route
        if: env.WRITE_TEST == 'true'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.FIXED_PR }}
          stage: conformance
          provider: auto
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.merged_route.outputs.provider == 'claude'
        with:
          repository: MongooseMoo/moo-conformance-tests
          path: moo-conformance-tests
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.merged_route.outputs.provider == 'claude'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.merged_route.outputs.provider == 'claude'

      # Installed into this run's own temporary home, as in the fix job.
      - name: Install Claude Code for this run
        if: steps.merged_route.outputs.provider == 'claude'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | HOME="$RUNNER_TEMP/claude-home" bash

      - name: Write the conformance test for the merged change
        id: merged_toast
        if: steps.merged_route.outputs.provider == 'claude'
        uses: $/.github/actions/conformance-test
        with:
          pr: ${{ github.event.pull_request.number }}
          merged: 'true'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_bin: *claude-bin
          claude_args: *claude-args
          conformance_pr_token: ${{ secrets.CONFORMANCE_PR_TOKEN }}

      - name: Classify and route merged conformance failure
        if: failure() && steps.merged_toast.outcome == 'failure'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.FIXED_PR }}
          stage: conformance
          provider: claude-failed
          execution_file: ${{ steps.merged_toast.outputs.execution_file }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      # Barn CI consumes suite main, so the companion follows the Barn verdict.
      - name: Finish the conformance pull request
        if: steps.merged_route.outputs.provider != 'codex'
        id: finish_companion
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE_TOKEN: ${{ secrets.CONFORMANCE_PR_TOKEN }}
          CODEX_ENABLED: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
        run: |
          set -euo pipefail
          # Use the existing protected publisher for a merged repair's test
          # PR. The generation credential need not be a protected merger.
          if [ "$MERGED" = true ] && [ "$CODEX_ENABLED" = true ]; then
            companion=$(gh api "repos/$SUITE/pulls?state=open&head=MongooseMoo:barn-fix/pr-$FIXED_PR&base=main" --jq '.[0].number // empty')
            if [ -n "$companion" ]; then
              echo "protected_publisher=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/scripts/repair_completion.py?ref=master" \
            > "$RUNNER_TEMP/repair_completion.py"
          GH_TOKEN="$SUITE_TOKEN" python3 "$RUNNER_TEMP/repair_completion.py" "$FIXED_PR"

      - name: Hand the existing companion to the protected publisher
        if: steps.finish_companion.outputs.protected_publisher == 'true'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.FIXED_PR }}
          stage: conformance
          provider: codex
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}
