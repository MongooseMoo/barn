name: Alarm investigation
run-name: Investigate #${{ inputs.issue_number }} / ${{ inputs.provider || 'auto' }}

# Runs Claude Code on one alarm issue (goodput-alarm or conformance-suite-alarm)
# and leaves a verdict on it: noise, explained by a named change, or a real
# regression with its cause (and a fix pull request when one can be made).
# The alarm workflows open their issues with GITHUB_TOKEN, whose events start
# no `issues` workflows, so scripts/conformance_suite_alarm.py `investigate()`
# dispatches this right after opening one (workflow_dispatch is exempt). Run it
# by hand on an existing alarm issue with
# `gh workflow run alarm-investigate.yml -f issue_number=N`.
# It only reports and proposes: it stops nothing, switches nothing off, and a
# fix pull request it opens is left for review (no auto-merge).
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Alarm issue to investigate
        required: true
        type: string
      provider:
        description: Provider to investigate the alarm
        type: choice
        options: [auto, claude, codex]
        default: auto

permissions:
  contents: read

concurrency:
  # One investigation at a time: re-measuring goodput needs an idle machine.
  group: alarm-investigate
  cancel-in-progress: false

env:
  ISSUE: ${{ inputs.issue_number }}
  # The goodput harness inputs, as in goodput-series.yml.
  FIXTURE: /mnt/c/Users/Q/projects/mongoose/db/mongoose.db.new.2026-11-12T0055
  FIXTURE_SHA256: 626bd284a498ce862b97eaad73edabdc8c057e2ac68b698aacee386f938f25e7
  SOUND_DB: /mnt/c/Users/Q/projects/mongoose/db/sound.sqlite.2026-11-09T2239
  SOUND_DB_SHA256: 0fcdc8d7f909d3e57a801ec1089b69c86fb390b4dc1d85331e25e68e00639318
  IDLE_LOAD: 8

jobs:
  investigate:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Check issue number
        run: '[[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue_number must be a number"; exit 1; }'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Route the investigation
        id: route
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.ISSUE }}
          stage: investigation
          provider: ${{ inputs.provider || 'auto' }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.route.outputs.provider == 'claude'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      # Same reason as in claude-fix.yml: the runners on one host share $HOME.
      - name: Install Claude Code for this run
        if: steps.route.outputs.provider == 'claude'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | HOME="$RUNNER_TEMP/claude-home" bash

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        id: claude
        if: steps.route.outputs.provider == 'claude'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude-home/.local/bin/claude
          allowed_bots: github-actions,mongoosemoo-barn-repair-worker
          settings: .github/claude-fix-settings.json
          prompt: |
            Investigate alarm issue #${{ env.ISSUE }} in ${{ github.repository }} and leave a verdict on it.

            Read CLAUDE.md and AGENTS.md first and follow them. Read the issue with
            `gh issue view ${{ env.ISSUE }} --comments`, the script that opened it
            (scripts/goodput_series.py for goodput-alarm, scripts/conformance_suite_alarm.py for
            conformance-suite-alarm) and the workflow run it links (`gh run view <id> --log`), which prints
            the series it judged. State nothing you have not checked against a run, an artifact, a commit or
            file:line.

            All runners share a Unix user and the machine's CPUs. Never kill processes by name or pattern;
            clean up only PIDs you started. The Bash hook blocks process-name kills; do not bypass it.

            Goodput alarm:
            1. List every point the alarm judged with its commit, time, `load` and `load_after_runs`
               (artifacts named goodput-point on runs of goodput-series.yml; scripts/goodput_series.py
               past_points shows how). Note points measured under load (load_after above $IDLE_LOAD) and
               whether points after the alarm returned to the earlier level.
            2. List the commits in the range the issue names (`git log --oneline A..B`) and read their diffs.
            3. Re-measure: build the harness for the last commit before the change and for the first commit
               after it (`git worktree add --detach <dir> <commit>`, then
               `go test -c -o <dir>/engine.test ./engine` there), copy $FIXTURE and $SOUND_DB to a temporary
               directory and check them against $FIXTURE_SHA256 and $SOUND_DB_SHA256, and run each binary
               alternately at least 5 times (A B A B ...) exactly as goodput-series.yml runs the harness
               (same BARN_MONGOOSE_* settings, run from the worktree's engine directory). Before each run
               wait until the 1-minute load average is below $IDLE_LOAD; record the load before and after
               each run. The harness output can name real players: print and post only the numbers
               (the `players=... goodput=...` lines), never other output.
            4. Verdict: if the medians of A and B are within the run-to-run spread, the alarm was noise. If B
               is lastingly worse, find the commit responsible within the range (re-measure its parent and it
               the same way) and the cause in its diff at file:line.

            Conformance suite alarm:
            1. From merge queue runs of ci.yml in the two weeks the alarm compared, list the "Run conformance
               suite" step seconds over time and find where the level changed.
            2. List merges into barn master and into MongooseMoo/moo-conformance-tests main around that point
               (`gh pr list --state merged`, both repositories); Barn CI runs the suite's tip, so a harness
               change there moves the time too.
            3. Compare the conformance-results artifacts (conformance-results.xml) of runs before and after:
               which tests appeared or vanished, and which tests' times moved most.
            4. Verdict: explained by an intended change (name the pull request and show the times moved where
               it did), or a defect (a hang, a new timeout, lost tests, or ordinary commands several times
               slower), with the tests and the cause.

            Then, for either kind:
            - Post exactly one comment on the issue (`gh issue comment ${{ env.ISSUE }} --body-file <file>`):
              the verdict on its first line, then the evidence (runs, commits, numbers, file:line), what is
              still unknown, and for a defect the next step.
            - Noise: close the issue with `gh issue close ${{ env.ISSUE }} --reason "not planned"`.
              Explained by an intended change: close it with `--reason completed`. A closed alarm issue
              restarts that alarm's comparison from the moment it was closed.
            - A defect whose cause you found and can fix: fix it on a branch named alarm/issue-${{ env.ISSUE }},
              with a test or measurement that shows the fix, and open a pull request against master whose body
              says "Fixes #${{ env.ISSUE }}" and holds the before and after numbers. Do not queue or arm its
              merge. A defect you cannot fix: leave the issue open; your comment is the handoff.
            Post nothing else: no other comments, issues or reviews.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"

      - name: Classify and route Claude investigation failure
        if: failure() && steps.claude.outcome == 'failure'
        uses: $/.github/actions/repair-route
        with:
          issue: ${{ env.ISSUE }}
          stage: investigation
          provider: claude-failed
          execution_file: ${{ steps.claude.outputs.execution_file }}
          codex_enabled: ${{ vars.BARN_CODEX_WORKER_ENABLED }}
          token: ${{ github.token }}
