name: CI

on:
  push:
    branches: [master]
  pull_request:
  # master uses a merge queue: GitHub merges each queued PR onto current
  # master on a temporary branch and runs these same required checks there,
  # so PRs no longer need manual "update branch" round-trips.
  merge_group:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build & unit tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      # A server run as root with /dev/null as its output database replaces the
      # device with a regular file; every later step then fails obscurely.
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Persistent runners already retain Go's caches on disk.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Types race tests
        run: go test -race ./types

      - name: Store race tests
        run: go test -race ./db/store

      - name: Benchmark driver tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  conformance:
    name: MOO conformance suite
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Check /dev/null is a device
        run: |
          if [ ! -c /dev/null ]; then
            echo "::error::/dev/null on this runner is not a character device: $(stat -c '%F %U:%G %a' /dev/null). Restore it as root with: rm /dev/null && mknod -m 666 /dev/null c 1 3"
            exit 1
          fi

      - name: Checkout barn
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Persistent runners already retain Go's caches on disk.
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Build barn
        run: go build -o bin/barn ./cmd/barn/

      # The conformance suite is the spec. It lives in its own repo and is a
      # read-only dependency here; CI always runs barn against its latest tip.
      - name: Checkout moo-conformance-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: MongooseMoo/moo-conformance-tests
          ref: main
          path: moo-conformance-tests

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # Managed mode: run the one supported default Linux/Test.db profile.
      # The suite owns the working DB copy and switches to bundled startup DBs.
      - name: Run conformance suite
        run: |
          uv run --project moo-conformance-tests --frozen moo-conformance \
            -m "admission or conformance" \
            --server-command "${{ github.workspace }}/bin/barn --db {db} --listen tcp://127.0.0.1:{port} --config=${{ github.workspace }}/profiles/barn/outbound-on.conf --profile-id=barn-linux-testdb-outbound-on --profile-manifest={manifest}" \
            --server-db="${{ github.workspace }}/moo-conformance-tests/src/moo_conformance/_db/Test.db" \
            --server-db-dir="${{ github.workspace }}/moo-conformance-tests/src/moo_conformance/_db/startup" \
            --moo-host=127.0.0.1 \
            --oracle-profile-manifest="${{ github.workspace }}/profiles/toast/stock-wsl-testdb.json" \
            --fail-on-unexpected-skip \
            --strict-markers \
            --admission-evidence-output="${{ github.workspace }}/conformance-admission.json" \
            --admission-evidence-context="barn-ci:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}:barn-linux-testdb-outbound-on" \
            -q \
            --junitxml="${{ github.workspace }}/conformance-results.xml"

      - name: Repeat issue 423 under CPU load
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -c 'while True: pass' &
          load1=$!
          python3 -c 'while True: pass' &
          load2=$!
          trap 'kill "$load1" "$load2"; wait "$load1" "$load2" || true' EXIT
          for run in $(seq 1 20); do
            kill -0 "$load1" "$load2"
            echo "Issue 423 managed run $run/20; two CPU load workers active"
            cat /proc/loadavg
            uv run --project moo-conformance-tests --frozen moo-conformance _tests/vm/tick_accounting.yaml \
              -m "admission or conformance" \
              -k "capability_admission or tick_exhaustion_extended_opcode_does_not_test_the_budget" \
              --server-command "${{ github.workspace }}/bin/barn --db {db} --listen tcp://127.0.0.1:{port} --config=${{ github.workspace }}/profiles/barn/outbound-on.conf --profile-id=barn-linux-testdb-outbound-on --profile-manifest={manifest}" \
              --server-db="${{ github.workspace }}/moo-conformance-tests/src/moo_conformance/_db/Test.db" \
              --server-db-dir="${{ github.workspace }}/moo-conformance-tests/src/moo_conformance/_db/startup" \
              --moo-host=127.0.0.1 \
              --oracle-profile-manifest="${{ github.workspace }}/profiles/toast/stock-wsl-testdb.json" \
              --fail-on-unexpected-skip --strict-markers \
              --admission-evidence-output="${{ github.workspace }}/issue-423-$run-admission.json" \
              --admission-evidence-context="issue-423:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}:$run" \
              --junitxml="${{ github.workspace }}/issue-423-$run-results.xml" -q
          done

      - name: Run Mongoose notification regressions
        run: |
          mkdir -p .tmp/conformance/db
          cp -R moo-conformance-tests/src/moo_conformance/_db/. .tmp/conformance/db/
          uv run --project moo-conformance-tests --frozen moo-conformance \
            --candidate-root="${{ github.workspace }}" \
            --moo-suite-root="${{ github.workspace }}/tests/mongoose-conformance" \
            --moo-suite-path=root/empty_notifications.yaml \
            --server-command "${{ github.workspace }}/bin/barn --db {db} --listen tcp://127.0.0.1:{port} --config=${{ github.workspace }}/profiles/barn/outbound-on.conf --profile-id=barn-linux-testdb-outbound-on --profile-manifest={manifest}" \
            --server-db="${{ github.workspace }}/.tmp/conformance/db/Test.db" \
            --server-db-dir="${{ github.workspace }}/.tmp/conformance/db/startup" \
            --moo-host=127.0.0.1 \
            --oracle-profile-manifest="${{ github.workspace }}/profiles/toast/stock-wsl-testdb.json" \
            --fail-on-unexpected-skip --strict-markers \
            --admission-evidence-output="${{ github.workspace }}/notifications-admission.json" \
            --admission-evidence-context="barn-notifications:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}" \
            --junitxml="${{ github.workspace }}/notifications-results.xml" -q

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-results
          path: |
            conformance-results.xml
            conformance-admission.json
            notifications-results.xml
            notifications-admission.json
            issue-423-*-results.xml
            issue-423-*-admission.json
          if-no-files-found: warn
