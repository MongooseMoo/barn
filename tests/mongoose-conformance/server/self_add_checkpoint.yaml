name: self_add_checkpoint
description: A self-add keeps its original left operand when a checkpoint interrupts the right operand.
requires:
  builtins: [create, recycle, add_property, delete_property, add_verb, set_verb_code, suspend, resume, task_id, dump_database]
  config: [managed_server]
tests:
  - name: resume_self_add_after_checkpoint
    permission: wizard
    timeout_ms: 30000
    steps:
      - run: |
          o = create($nothing);
          add_property(#1, "conformance_self_add", o, {player, ""});
          for name in ({"direct_id", "helper_id", "entered", "returned", "total", "text"})
            add_property(o, name, 0, {player, ""});
          endfor
          for name in ({"direct", "nested", "part"})
            add_verb(o, {player, "rxd", name}, {"this", "none", "this"});
          endfor
          errors = set_verb_code(o, "direct", {
            "word = \"old\";",
            "this.direct_id = task_id();",
            "word = word + suspend(word = 3600);",
            "this.text = word;"});
          if (errors) raise(E_INVARG, "direct", errors); endif
          errors = set_verb_code(o, "nested", {
            "total = 10;",
            "for item in ({2, 3, 5})",
            "  try",
            "    total = total + this:part(item);",
            "  except e (ANY)",
            "    this.total = e[1];",
            "    return;",
            "  endtry",
            "endfor",
            "this.total = total;"});
          if (errors) raise(E_INVARG, "nested", errors); endif
          errors = set_verb_code(o, "part", {
            "this.entered = this.entered + 1;",
            "if (args[1] == 3)",
            "  this.helper_id = task_id();",
            "  suspend();",
            "endif",
            "this.returned = this.returned + 1;",
            "return args[1];"});
          if (errors) raise(E_INVARG, "part", errors); endif
          fork (0) o:direct(); endfork
          fork (0) o:nested(); endfork
          return 0;
        expect:
          value: 0
      - wait: 500
      - run: |
          o = #1.conformance_self_add;
          return {o.direct_id != 0, o.helper_id != 0, o.entered, o.returned, o.total, o.text};
        expect:
          value: [1, 1, 2, 1, 0, 0]
      - run: "return dump_database();"
        expect:
          value: 0
      - restart_server:
          wait_ms: 300
          checkpoint_timeout_ms: 5000
      - run: |
          o = #1.conformance_self_add;
          resume(o.direct_id, " value");
          resume(o.helper_id);
          return 0;
        expect:
          value: 0
      - wait: 500
      - run: |
          o = #1.conformance_self_add;
          return {o.entered, o.returned, o.total, o.text};
        expect:
          value: [3, 3, 20, "old value"]
    cleanup:
      - run: |
          o = #1.conformance_self_add;
          delete_property(#1, "conformance_self_add");
          recycle(o);
          return 0;
