name: recycle_unrelated_tasks
description: Recycle leaves unrelated tasks queued and reserves only anonymous objects across suspended hooks.
requires:
  builtins: [create, recycle, valid, queued_tasks, kill_task, add_property, add_verb, set_verb_code, delete_verb, suspend]
tests:
  - name: recycle_with_twelve_future_tasks
    steps:
      - run: |
          jobs = {};
          obj = create($nothing);
          try
            for i in [1..12]
              fork job (60)
                return 0;
              endfork
              jobs = {@jobs, job};
            endfor
            before = length(queued_tasks());
            recycle(obj);
            result = {!valid(obj), length(queued_tasks()) == before};
          finally
            for job in (jobs)
              `kill_task(job) ! E_INVARG';
            endfor
            if (valid(obj))
              recycle(obj);
            endif
          endtry
          return result;
        as: wizard
        expect:
          value: [1, 1]

  - name: recycle_suspended_hook_competition_anonymous_{anonymous}
    permission: wizard
    table:
      columns: [anonymous, entries]
      rows: [[0, 2], [1, 1]]
    setup:
      code: |
        rec = create($nothing);
        proto = create($nothing);
        add_property(rec, "started", 0, {player, "rw"});
        add_property(rec, "release", 0, {player, "rw"});
        add_property(rec, "calls", 0, {player, "rw"});
        add_property(rec, "finished", 0, {player, "rw"});
        add_property(rec, "first", -1, {player, "rw"});
        add_property(rec, "second", -1, {player, "rw"});
        add_property(proto, "rec", rec, {player, "r"});
        add_verb(proto, {player, "rxd", "recycle"}, {"this", "none", "this"});
        set_verb_code(proto, "recycle", {
          "rec = this.rec; rec.started = rec.started + 1;",
          "while (!rec.release) suspend(0); endwhile",
          "rec.calls = rec.calls + 1;"
        });
        obj = create(proto, {anonymous});
    statement: |
      second = 0;
      fork first (0)
        rec.first = `recycle(obj) ! ANY';
        rec.finished = rec.finished + 1;
      endfork
      try
        for i in [1..100]
          suspend(0);
          if (rec.started) break; endif
        endfor
        if (!rec.started) raise(E_QUOTA); endif
        fork second (0)
          rec.second = `recycle(obj) ! ANY';
          rec.finished = rec.finished + 1;
        endfork
        for i in [1..100]
          suspend(0);
          if (rec.started == {entries} && (!{anonymous} || rec.finished == 1)) break; endif
        endfor
        if (rec.started != {entries}) raise(E_QUOTA); endif
        live_during_hook = valid(obj);
        rec.release = 1;
        for i in [1..100]
          suspend(0);
          if (rec.finished == 2) break; endif
        endfor
        return {rec.started == {entries}, rec.calls == {entries}, live_during_hook,
                !valid(obj), rec.finished == 2,
                {rec.first, rec.second} == {0, E_INVARG} || {rec.first, rec.second} == {E_INVARG, 0}};
      finally
        rec.release = 1;
        `kill_task(first) ! E_INVARG';
        if (second) `kill_task(second) ! E_INVARG'; endif
        delete_verb(proto, "recycle");
        if (valid(obj)) recycle(obj); endif
        recycle(proto);
        recycle(rec);
      endtry
    expect:
      value: [1, 1, 1, 1, 1, 1]
