name: parse_ast
description: >
  Mongoose ToastStunt fork builtin parse_ast(LIST code): the syntax tree of the
  compiled code as a list of statement maps. Each tree is compared through
  toliteral(), so node keys, their order and value types are all pinned.
  Expected values were taken from the fork build in
  profiles/toast/mongoose-0ff6fd7-wsl-testdb.json.
requires:
  features: [ast]
tests:
  - name: empty_program_is_empty_list
    permission: programmer
    code: 'toliteral(parse_ast({}))'
    expect:
      value: '{}'

  - name: literals
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {1, -1, 1.5, -2.5, \"one\", #1, #-1, E_PERM, -(5), - -5};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["type" -> "literal", "value" -> 1], ["type" -> "literal", "value" -> -1], ["type" -> "literal", "value" -> 1.5], ["type" -> "literal", "value" -> -2.5], ["type" -> "literal", "value" -> "one"], ["type" -> "literal", "value" -> #1], ["type" -> "literal", "value" -> #-1], ["type" -> "literal", "value" -> E_PERM], ["type" -> "literal", "value" -> -5], ["type" -> "literal", "value" -> 5]}, "type" -> "list"]]}'

  - name: float_and_integer_spelling
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {1e20, 0.1, 1.0e-10, 100000.0, 1.0, 3.14159, 9223372036854775807};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["type" -> "literal", "value" -> 1e+20], ["type" -> "literal", "value" -> 0.1], ["type" -> "literal", "value" -> 1e-10], ["type" -> "literal", "value" -> 100000.0], ["type" -> "literal", "value" -> 1.0], ["type" -> "literal", "value" -> 3.14159], ["type" -> "literal", "value" -> 9223372036854775807]}, "type" -> "list"]]}'

  - name: variables_take_first_spelling_and_builtin_spelling
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"Foo = 1;", "return {foo, FOO, PLAYER, This, true, False, int, Obj};"}));
        expect:
          value: '{["expr" -> ["target" -> ["name" -> "Foo", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 1]], "type" -> "expr"], ["type" -> "return", "value" -> ["items" -> {["name" -> "Foo", "type" -> "variable"], ["name" -> "Foo", "type" -> "variable"], ["name" -> "player", "type" -> "variable"], ["name" -> "this", "type" -> "variable"], ["name" -> "true", "type" -> "variable"], ["name" -> "false", "type" -> "variable"], ["name" -> "INT", "type" -> "variable"], ["name" -> "OBJ", "type" -> "variable"]}, "type" -> "list"]]}'

  - name: binary_operators
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {a + b, a - b, a * b, a / b, a % b, a ^ b, a && b, a || b, a == b, a != b, a < b, a <= b, a > b, a >= b, a in b, a |. b, a &. b, a ^. b, a << b, a >> b};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "+", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "-", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "*", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "/", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "%", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "^", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "&&", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "||", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "==", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "!=", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "<", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "<=", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> ">", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> ">=", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "in", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "|.", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "&.", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "^.", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> "<<", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"], ["lhs" -> ["name" -> "a", "type" -> "variable"], "op" -> ">>", "rhs" -> ["name" -> "b", "type" -> "variable"], "type" -> "binary"]}, "type" -> "list"]]}'

  - name: unary_operators
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {-a, !a, ~a, -a.b, !!a};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["expr" -> ["name" -> "a", "type" -> "variable"], "op" -> "-", "type" -> "unary"], ["expr" -> ["name" -> "a", "type" -> "variable"], "op" -> "!", "type" -> "unary"], ["expr" -> ["name" -> "a", "type" -> "variable"], "op" -> "~", "type" -> "unary"], ["expr" -> ["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["type" -> "literal", "value" -> "b"], "type" -> "prop"], "op" -> "-", "type" -> "unary"], ["expr" -> ["expr" -> ["name" -> "a", "type" -> "variable"], "op" -> "!", "type" -> "unary"], "op" -> "!", "type" -> "unary"]}, "type" -> "list"]]}'

  - name: parentheses_and_precedence_are_not_kept
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return (1 + 2) * 3 ^ 2 % 4 == !x || y in l && ~z;", "return ((a));"}));
        expect:
          value: '{["type" -> "return", "value" -> ["lhs" -> ["lhs" -> ["lhs" -> ["lhs" -> ["lhs" -> ["lhs" -> ["type" -> "literal", "value" -> 1], "op" -> "+", "rhs" -> ["type" -> "literal", "value" -> 2], "type" -> "binary"], "op" -> "*", "rhs" -> ["lhs" -> ["type" -> "literal", "value" -> 3], "op" -> "^", "rhs" -> ["type" -> "literal", "value" -> 2], "type" -> "binary"], "type" -> "binary"], "op" -> "%", "rhs" -> ["type" -> "literal", "value" -> 4], "type" -> "binary"], "op" -> "==", "rhs" -> ["expr" -> ["name" -> "x", "type" -> "variable"], "op" -> "!", "type" -> "unary"], "type" -> "binary"], "op" -> "||", "rhs" -> ["lhs" -> ["name" -> "y", "type" -> "variable"], "op" -> "in", "rhs" -> ["name" -> "l", "type" -> "variable"], "type" -> "binary"], "type" -> "binary"], "op" -> "&&", "rhs" -> ["expr" -> ["name" -> "z", "type" -> "variable"], "op" -> "~", "type" -> "unary"], "type" -> "binary"]], ["type" -> "return", "value" -> ["name" -> "a", "type" -> "variable"]]}'

  - name: properties
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {a.b, a.(b), $b, a.(\"c\"), #5.d};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["type" -> "literal", "value" -> "b"], "type" -> "prop"], ["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["name" -> "b", "type" -> "variable"], "type" -> "prop"], ["object" -> ["type" -> "literal", "value" -> #0], "property" -> ["type" -> "literal", "value" -> "b"], "type" -> "prop"], ["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["type" -> "literal", "value" -> "c"], "type" -> "prop"], ["object" -> ["type" -> "literal", "value" -> #5], "property" -> ["type" -> "literal", "value" -> "d"], "type" -> "prop"]}, "type" -> "list"]]}'

  - name: waif_property_spelling
    # Barn's parser has no `x.:name' spelling (known difference).
    skip_if: "feature.no_waif_colon_property"
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return a.:w;"}));
        expect:
          value: '{["type" -> "return", "value" -> ["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["type" -> "literal", "value" -> ":w"], "type" -> "prop"]]}'

  - name: verb_calls
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"a:b();", "a:(b)(1, @c);", "$d(2);", "a:(\"e\")();"}));
        expect:
          value: '{["expr" -> ["args" -> {}, "object" -> ["name" -> "a", "type" -> "variable"], "type" -> "verb_call", "verb" -> ["type" -> "literal", "value" -> "b"]], "type" -> "expr"], ["expr" -> ["args" -> {["type" -> "literal", "value" -> 1], ["expr" -> ["name" -> "c", "type" -> "variable"], "type" -> "splice"]}, "object" -> ["name" -> "a", "type" -> "variable"], "type" -> "verb_call", "verb" -> ["name" -> "b", "type" -> "variable"]], "type" -> "expr"], ["expr" -> ["args" -> {["type" -> "literal", "value" -> 2]}, "object" -> ["type" -> "literal", "value" -> #0], "type" -> "verb_call", "verb" -> ["type" -> "literal", "value" -> "d"]], "type" -> "expr"], ["expr" -> ["args" -> {}, "object" -> ["name" -> "a", "type" -> "variable"], "type" -> "verb_call", "verb" -> ["type" -> "literal", "value" -> "e"]], "type" -> "expr"]}'

  - name: builtin_calls
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {length(a), time(), tostr(@a, 1)};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["args" -> {["name" -> "a", "type" -> "variable"]}, "function" -> "length", "type" -> "call"], ["args" -> {}, "function" -> "time", "type" -> "call"], ["args" -> {["expr" -> ["name" -> "a", "type" -> "variable"], "type" -> "splice"], ["type" -> "literal", "value" -> 1]}, "function" -> "tostr", "type" -> "call"]}, "type" -> "list"]]}'

  - name: indexes_and_ranges
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {a[1], a[^..$], a[$], a[2..3][^]};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["base" -> ["name" -> "a", "type" -> "variable"], "index" -> ["type" -> "literal", "value" -> 1], "type" -> "index"], ["base" -> ["name" -> "a", "type" -> "variable"], "from" -> ["type" -> "first"], "to" -> ["type" -> "last"], "type" -> "range"], ["base" -> ["name" -> "a", "type" -> "variable"], "index" -> ["type" -> "last"], "type" -> "index"], ["base" -> ["base" -> ["name" -> "a", "type" -> "variable"], "from" -> ["type" -> "literal", "value" -> 2], "to" -> ["type" -> "literal", "value" -> 3], "type" -> "range"], "index" -> ["type" -> "first"], "type" -> "index"]}, "type" -> "list"]]}'

  - name: lists_and_maps
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {{}, {1, @a}, [], [\"a\" -> 1, b -> c]};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["items" -> {}, "type" -> "list"], ["items" -> {["type" -> "literal", "value" -> 1], ["expr" -> ["name" -> "a", "type" -> "variable"], "type" -> "splice"]}, "type" -> "list"], ["entries" -> {}, "type" -> "map"], ["entries" -> {["key" -> ["type" -> "literal", "value" -> "a"], "value" -> ["type" -> "literal", "value" -> 1]], ["key" -> ["name" -> "b", "type" -> "variable"], "value" -> ["name" -> "c", "type" -> "variable"]]}, "type" -> "map"]}, "type" -> "list"]]}'

  - name: assignments
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"a = 1;", "a.b = 2;", "a[1] = 3;", "a[1..2] = {};", "l[^][1] = 4;", "$p = a = 5;"}));
        expect:
          value: '{["expr" -> ["target" -> ["name" -> "a", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 1]], "type" -> "expr"], ["expr" -> ["target" -> ["object" -> ["name" -> "a", "type" -> "variable"], "property" -> ["type" -> "literal", "value" -> "b"], "type" -> "prop"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 2]], "type" -> "expr"], ["expr" -> ["target" -> ["base" -> ["name" -> "a", "type" -> "variable"], "index" -> ["type" -> "literal", "value" -> 1], "type" -> "index"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 3]], "type" -> "expr"], ["expr" -> ["target" -> ["base" -> ["name" -> "a", "type" -> "variable"], "from" -> ["type" -> "literal", "value" -> 1], "to" -> ["type" -> "literal", "value" -> 2], "type" -> "range"], "type" -> "assign", "value" -> ["items" -> {}, "type" -> "list"]], "type" -> "expr"], ["expr" -> ["target" -> ["base" -> ["base" -> ["name" -> "l", "type" -> "variable"], "index" -> ["type" -> "first"], "type" -> "index"], "index" -> ["type" -> "literal", "value" -> 1], "type" -> "index"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 4]], "type" -> "expr"], ["expr" -> ["target" -> ["object" -> ["type" -> "literal", "value" -> #0], "property" -> ["type" -> "literal", "value" -> "p"], "type" -> "prop"], "type" -> "assign", "value" -> ["target" -> ["name" -> "a", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 5]]], "type" -> "expr"]}'

  - name: scatter_assignment
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"{a, ?b, ?c = 1, @d} = args;", "{e, f} = g;"}));
        expect:
          value: '{["expr" -> ["target" -> ["items" -> {["kind" -> "required", "var" -> "a"], ["kind" -> "optional", "var" -> "b"], ["default" -> ["type" -> "literal", "value" -> 1], "kind" -> "optional", "var" -> "c"], ["kind" -> "rest", "var" -> "d"]}, "type" -> "scatter"], "type" -> "assign", "value" -> ["name" -> "args", "type" -> "variable"]], "type" -> "expr"], ["expr" -> ["target" -> ["items" -> {["kind" -> "required", "var" -> "e"], ["kind" -> "required", "var" -> "f"]}, "type" -> "scatter"], "type" -> "assign", "value" -> ["name" -> "g", "type" -> "variable"]], "type" -> "expr"]}'

  - name: conditional_and_catch_expressions
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"return {a ? b | c, `a ! ANY', `a ! E_PERM, @b => 0', `a ! ANY => 1'};"}));
        expect:
          value: '{["type" -> "return", "value" -> ["items" -> {["alternate" -> ["name" -> "c", "type" -> "variable"], "condition" -> ["name" -> "a", "type" -> "variable"], "consequent" -> ["name" -> "b", "type" -> "variable"], "type" -> "conditional"], ["expr" -> ["name" -> "a", "type" -> "variable"], "type" -> "catch"], ["codes" -> {["type" -> "literal", "value" -> E_PERM], ["expr" -> ["name" -> "b", "type" -> "variable"], "type" -> "splice"]}, "default" -> ["type" -> "literal", "value" -> 0], "expr" -> ["name" -> "a", "type" -> "variable"], "type" -> "catch"], ["default" -> ["type" -> "literal", "value" -> 1], "expr" -> ["name" -> "a", "type" -> "variable"], "type" -> "catch"]}, "type" -> "list"]]}'

  - name: if_statements
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"if (a)", "endif", "if (a)", "return;", "elseif (b)", "else", "return 1;", "endif"}));
        expect:
          value: '{["arms" -> {["body" -> {}, "condition" -> ["name" -> "a", "type" -> "variable"]]}, "type" -> "if"], ["arms" -> {["body" -> {["type" -> "return"]}, "condition" -> ["name" -> "a", "type" -> "variable"]], ["body" -> {}, "condition" -> ["name" -> "b", "type" -> "variable"]]}, "else" -> {["type" -> "return", "value" -> ["type" -> "literal", "value" -> 1]]}, "type" -> "if"]}'

  - name: else_if_is_not_elseif
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"if (a)", "x = 1;", "else", "if (b)", "x = 2;", "endif", "endif"}));
        expect:
          value: '{["arms" -> {["body" -> {["expr" -> ["target" -> ["name" -> "x", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 1]], "type" -> "expr"]}, "condition" -> ["name" -> "a", "type" -> "variable"]]}, "else" -> {["arms" -> {["body" -> {["expr" -> ["target" -> ["name" -> "x", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 2]], "type" -> "expr"]}, "condition" -> ["name" -> "b", "type" -> "variable"]]}, "type" -> "if"]}, "type" -> "if"]}'

  - name: empty_else_block
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"if (a)", "x = 1;", "else", "endif"}));
        expect:
          value: '{["arms" -> {["body" -> {["expr" -> ["target" -> ["name" -> "x", "type" -> "variable"], "type" -> "assign", "value" -> ["type" -> "literal", "value" -> 1]], "type" -> "expr"]}, "condition" -> ["name" -> "a", "type" -> "variable"]]}, "type" -> "if"]}'

  - name: loops
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"for v in (l)", "break;", "endfor", "for v, k in (l)", "endfor", "for i in [1..n]", "continue;", "endfor", "while (a)", "endwhile", "while w (a)", "break w;", "continue w;", "endwhile"}));
        expect:
          value: '{["body" -> {["type" -> "break"]}, "expr" -> ["name" -> "l", "type" -> "variable"], "type" -> "for", "var" -> "v"], ["body" -> {}, "expr" -> ["name" -> "l", "type" -> "variable"], "index" -> "k", "type" -> "for", "var" -> "v"], ["body" -> {["type" -> "continue"]}, "from" -> ["type" -> "literal", "value" -> 1], "to" -> ["name" -> "n", "type" -> "variable"], "type" -> "for_range", "var" -> "i"], ["body" -> {}, "condition" -> ["name" -> "a", "type" -> "variable"], "type" -> "while"], ["body" -> {["name" -> "w", "type" -> "break"], ["name" -> "w", "type" -> "continue"]}, "condition" -> ["name" -> "a", "type" -> "variable"], "name" -> "w", "type" -> "while"]}'

  - name: fork_statements
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"fork (0)", "return;", "endfork", "fork t (5)", "endfork"}));
        expect:
          value: '{["body" -> {["type" -> "return"]}, "delay" -> ["type" -> "literal", "value" -> 0], "type" -> "fork"], ["body" -> {}, "delay" -> ["type" -> "literal", "value" -> 5], "type" -> "fork", "var" -> "t"]}'

  - name: try_statements
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"try", "return;", "except e (E_PERM, @codes)", "except (ANY)", "return 1;", "endtry", "try", "return;", "finally", "endtry"}));
        expect:
          value: '{["body" -> {["type" -> "return"]}, "excepts" -> {["body" -> {}, "codes" -> {["type" -> "literal", "value" -> E_PERM], ["expr" -> ["name" -> "codes", "type" -> "variable"], "type" -> "splice"]}, "var" -> "e"], ["body" -> {["type" -> "return", "value" -> ["type" -> "literal", "value" -> 1]]}]}, "type" -> "try_except"], ["body" -> {["type" -> "return"]}, "finally" -> {}, "type" -> "try_finally"]}'

  - name: string_statement_is_kept
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({"\"a comment\";", "return 1;"}));
        expect:
          value: '{["expr" -> ["type" -> "literal", "value" -> "a comment"], "type" -> "expr"], ["type" -> "return", "value" -> ["type" -> "literal", "value" -> 1]]}'

  - name: lone_semicolon_is_dropped
    permission: programmer
    steps:
      - run: |
          return toliteral(parse_ast({";", "return 1;", ";"}));
        expect:
          value: '{["type" -> "return", "value" -> ["type" -> "literal", "value" -> 1]]}'

  - name: non_list_argument_is_type_error
    permission: programmer
    code: 'parse_ast("return 1;")'
    expect:
      error: E_TYPE

  - name: non_string_line_is_type_error
    permission: programmer
    code: 'parse_ast({"return 1;", 2})'
    expect:
      error: E_TYPE

  - name: wrong_argument_count_is_args_error
    permission: programmer
    steps:
      - run: 'return toliteral({`call_function("parse_ast") ! ANY'', `call_function("parse_ast", {}, {}) ! ANY''});'
        expect:
          value: '{E_ARGS, E_ARGS}'

  - name: syntax_error_raises_invarg_with_the_parser_errors
    permission: programmer
    steps:
      - run: |
          try
            parse_ast({"x = 1;", "return +;"});
            return "no error";
          except e (E_INVARG)
            return toliteral(e[1..3]);
          endtry
        expect:
          value: '{E_INVARG, "Line 2:  syntax error", {"Line 2:  syntax error"}}'

  - name: compile_errors_are_listed_like_set_verb_code
    permission: programmer
    steps:
      - run: |
          try
            parse_ast({"break;", "no_such_function();"});
            return "no error";
          except e (E_INVARG)
            return toliteral(e[1..3]);
          endtry
        expect:
          value: '{E_INVARG, "Line 1:  No enclosing loop for `break'' statement", {"Line 1:  No enclosing loop for `break'' statement", "Line 2:  Unknown built-in function: no_such_function"}}'

  - name: function_info
    permission: programmer
    code: 'toliteral(function_info("parse_ast"))'
    expect:
      value: '{"parse_ast", 1, 1, {4}}'
