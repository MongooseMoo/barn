name: clear_property_metadata
description: Clearing an inherited value retains its per-object property metadata.
requires:
  builtins: [create, recycle, add_property, clear_property, property_info, set_property_info, add_verb, set_verb_code]
tests:
  - name: clear_then_coarse_mutation_retains_property_metadata
    permission: wizard
    steps:
      - run: |
          ancestor = create($nothing);
          add_property(ancestor, "value", 3, {player, "rw"});
          child = create(ancestor);
          try
            child.value = 7;
            before = property_info(child, "value");
            clear_property(child, "value");
            add_verb(ancestor, {player, "rxd", "probe"}, {"this", "none", "this"});
            errors = set_verb_code(ancestor, "probe", {"return this.value;"});
            if (errors) raise(E_INVARG, "probe did not compile", errors); endif
            same = property_info(child, "value") == before;
            set_property_info(child, "value", {player, "r"});
            return {same, child:probe(), property_info(child, "value") == {player, "r"}};
          finally
            recycle(child);
            recycle(ancestor);
          endtry
        expect:
          value: [1, 3, 1]
