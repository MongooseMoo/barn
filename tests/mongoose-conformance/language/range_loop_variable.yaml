name: range_loop_variable
description: Assigning a range loop variable does not change its private iteration cursor.
tests:
  - name: range_mutated_variable
    permission: wizard
    statement: |
      seen = {};
      for i in [1..3]
        seen = {@seen, i};
        i = 99;
      endfor
      return seen;
    expect:
      value: [1, 2, 3]
  - name: range_mutated_variable_at_maximum_integer
    permission: wizard
    statement: |
      seen = {};
      for i in [9223372036854775805..9223372036854775807]
        seen = {@seen, i};
        i = 99;
      endfor
      return seen;
    expect:
      value: [9223372036854775805, 9223372036854775806, 9223372036854775807]
  - name: range_rejected_type_preserves_variable
    permission: wizard
    statement: |
      results = {};
      for bounds in ({{1.0, 2.0}, {2.0, 1.0}, {1, 2.0}})
        i = 99;
        caught = 0;
        try
          for i in [bounds[1]..bounds[2]] endfor
        except (E_TYPE)
          caught = 1;
        endtry
        results = {@results, {caught, i}};
      endfor
      return results;
    expect:
      value: [[1, 99], [1, 99], [1, 99]]
  - name: range_continue_runs_finally_per_iteration
    permission: wizard
    statement: |
      seen = {};
      for i in [1..3]
        try
          continue;
        finally
          seen = {@seen, i};
        endtry
      endfor
      return seen;
    expect:
      value: [1, 2, 3]
